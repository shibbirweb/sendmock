# The Phase 3P done-when check: apps on each gateway's official library run against a SendMock
# release binary that cannot reach the network. The Stripe Node SDK pays a Checkout Session,
# verifies the webhooks with constructEvent, handles a declined card and refunds (the PHP and
# Python SDKs then verify the same deliveries); PayPal's Node SDK captures an order, checks its
# webhooks with verify-webhook-signature, handles a decline and refunds; SSLCommerz's Node
# package pays, checks the IPN's verify_sign, validates the order, handles a decline and
# refunds. SendMock runs as its own system user whose traffic beyond loopback is rejected, and
# the last step fails if a single packet was (PY-01.3). Runs on changes to the payment code or
# the examples, and from Release build before anything is published.
name: Payment apps

on:
  pull_request:
  push:
    branches:
      - develop
      - main
    paths:
      - crates/sendmock-payments/**
      - crates/sendmock-ops/src/payments/**
      - crates/sendmock-ops/src/stripe/**
      - crates/sendmock-ops/src/sslcommerz/**
      - crates/sendmock-ops/src/paypal/**
      - crates/sendmock-ops/src/providers/**
      - crates/sendmock-ops/src/webhooks/**
      - crates/sendmock-ops/builtin/**
      - examples/payments/**
      - .github/actions/**
      - .github/workflows/payment-apps.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      run_every_job:
        description: Run every job without reading the pull request's changes (a calling workflow decides)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      is_affected: ${{ steps.changed-paths.outputs.is_affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci

      - id: changed-paths
        uses: ./.github/actions/changed-paths
        with:
          run-every-job: ${{ github.event_name != 'pull_request' || inputs.run_every_job == true }}
          paths: |
            crates/sendmock-payments/**
            crates/sendmock-ops/src/payments/**
            crates/sendmock-ops/src/stripe/**
            crates/sendmock-ops/src/sslcommerz/**
            crates/sendmock-ops/src/paypal/**
            crates/sendmock-ops/src/providers/**
            crates/sendmock-ops/src/webhooks/**
            crates/sendmock-ops/builtin/**
            examples/payments/**
            .github/actions/**
            .github/workflows/payment-apps.yml

  apps:
    name: Stripe, PayPal, SSLCommerz, Razorpay and Paddle apps offline
    needs: changes
    if: needs.changes.outputs.is_affected == 'true'
    runs-on: ubuntu-latest
    env:
      SENDMOCK_URL: http://127.0.0.1:8025
      SENDMOCK_PROVIDER_URL: http://127.0.0.1:8026
      STRIPE_DELIVERIES_PATH: ${{ github.workspace }}/stripe-deliveries.json
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Live UI the binary embeds
        working-directory: web
        env:
          VITE_API_MODE: live
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Release build
        run: cargo build --release --locked -p sendmock

      - uses: ./.github/actions/start-sendmock-offline

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Checkout, webhooks, a decline and a refund with Stripe's Node SDK
        working-directory: examples/payments/stripe-node
        run: bun install && node done-when.js

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Verify the deliveries with the PHP SDK
        working-directory: examples/payments/stripe-php
        run: composer install --no-interaction --no-progress && php verify.php

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify the deliveries with the Python SDK
        working-directory: examples/payments/stripe-python
        run: pip install --quiet -r requirements.txt && python verify.py

      - name: Capture, check the webhooks, decline and refund with PayPal's Node SDK
        working-directory: examples/payments/paypal-node
        run: bun install && node done-when.js

      - name: Pay, check the IPN, validate, decline and refund with SSLCommerz's Node package
        working-directory: examples/payments/sslcommerz-node
        run: bun install && node done-when.js

      - name: Pay, check both signatures, decline and refund with Razorpay's Node SDK
        working-directory: examples/payments/razorpay-node
        run: bun install && node done-when.js

      - name: Pay, decline and refund, each notification unmarshalled by Paddle's Node SDK
        working-directory: examples/payments/paddle-node
        run: bun install && node done-when.js

      - uses: ./.github/actions/check-sendmock-offline

      - name: SendMock log
        if: failure()
        run: cat sendmock.log

  # The required check: it reports on every pull request, and fails unless each job above
  # passed or was skipped because the pull request did not touch its paths.
  passed:
    name: Payment apps passed
    if: always()
    needs:
      - changes
      - apps
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(echo "$JOB_RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed_jobs" ]; then
            echo "::error::Not every job passed: $failed_jobs"
            exit 1
          fi
