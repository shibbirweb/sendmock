# The official Twilio SDKs (Node, Python, PHP, Go, Java, C# and Ruby) send an SMS with status
# callbacks to a local handler and run a Verify login against a SendMock release binary (SM-02.4,
# VF-03.4, the Phase 2 done-when check). Runs on changes to the SMS code or the examples, and from Release
# build before anything is published.
name: SMS clients

on:
  pull_request:
  push:
    branches:
      - develop
      - main
    paths:
      - crates/sendmock-sms/**
      - crates/sendmock-ops/src/providers/**
      - crates/sendmock-ops/src/sms/**
      - crates/sendmock-ops/src/verify/**
      - crates/sendmock-ops/builtin/**
      - examples/sms/**
      - .github/workflows/sms-clients.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      run_every_job:
        description: Run every job without reading the pull request's changes (a calling workflow decides)
        type: boolean
        default: true
      skip_every_job:
        description: Report every job with its steps skipped, when the calling workflow has nothing to do
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      is_affected: ${{ steps.changed-paths.outputs.is_affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci

      - id: changed-paths
        uses: ./.github/actions/changed-paths
        with:
          run-every-job: ${{ github.event_name != 'pull_request' || inputs.run_every_job == true }}
          skip-every-job: ${{ inputs.skip_every_job == true }}
          paths: |
            crates/sendmock-sms/**
            crates/sendmock-ops/src/providers/**
            crates/sendmock-ops/src/sms/**
            crates/sendmock-ops/src/verify/**
            crates/sendmock-ops/builtin/**
            examples/sms/**
            .github/workflows/sms-clients.yml

  binary:
    name: Release binary
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.is_affected == 'true'
        uses: actions/checkout@v7

      - if: needs.changes.outputs.is_affected == 'true'
        uses: oven-sh/setup-bun@v2

      - if: needs.changes.outputs.is_affected == 'true'
        name: Live UI the binary embeds
        working-directory: web
        env:
          VITE_API_MODE: live
        run: |
          bun install --frozen-lockfile
          bun run build

      - if: needs.changes.outputs.is_affected == 'true'
        name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - if: needs.changes.outputs.is_affected == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - if: needs.changes.outputs.is_affected == 'true'
        name: Release build
        run: cargo build --release --locked -p sendmock

      - if: needs.changes.outputs.is_affected == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sendmock-for-sms-clients
          path: target/release/sendmock
          retention-days: 1

  client:
    name: ${{ matrix.client }}
    needs: [changes, binary]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: Twilio Node SDK
            language: node
            folder: node-twilio
            run: bun install && node send-and-verify.js
          # AC: SM-19.8
          - client: Twilio Node SDK with a subaccount
            language: node
            folder: node-twilio-subaccounts
            run: bun install && node send-under-subaccount-and-verify.js
          # AC: SM-19.8
          - client: Twilio PHP SDK with a subaccount
            language: php
            folder: php-twilio-subaccounts
            run: composer install --no-interaction --quiet && php send-under-subaccount-and-verify.php
          # AC: PL-21.7
          - client: Twilio Node SDK with a call answered by a provider bin
            language: node
            folder: node-twilio-calls-gap
            run: bun install && node answer-calls-and-verify.js
          # AC: SM-20.5
          - client: Twilio Node SDK with numbers
            language: node
            folder: node-twilio-numbers
            run: bun install && node provision-and-send.js
          # AC: SM-20.5
          - client: Twilio PHP SDK with numbers
            language: php
            folder: php-twilio-numbers
            run: composer install --no-interaction --quiet && php provision-and-verify.php
          - client: Twilio Python SDK
            language: python
            folder: python-twilio
            run: pip install --quiet -r requirements.txt && python send_and_verify.py
          - client: Twilio PHP SDK
            language: php
            folder: php-twilio
            run: composer install --no-interaction --quiet && php send-and-verify.php
          - client: Twilio Go SDK
            language: go
            folder: go-twilio
            run: go run .
          - client: Twilio Java SDK
            language: java
            folder: java-twilio
            run: mvn --quiet --batch-mode compile org.codehaus.mojo:exec-maven-plugin:3.5.1:java
          - client: Twilio C# SDK
            language: dotnet
            folder: dotnet-twilio
            run: dotnet run
          - client: Twilio Ruby SDK
            language: ruby
            folder: ruby-twilio
            run: bundle install --quiet && bundle exec ruby send_and_verify.rb
          # AC: SM-17.1
          - client: Infobip Node SDK
            language: node
            folder: node-infobip
            run: bun install && node send-and-verify.js
          # AC: SM-17.2 PL-10.4
          - client: Telnyx Node SDK
            language: node
            folder: node-telnyx
            run: bun install && node send-and-verify.js
          # AC: SM-17.3
          - client: Sinch Node SDK
            language: node
            folder: node-sinch
            run: bun install && node send-and-verify.js
          # AC: SM-17.4
          - client: Africa's Talking Node SDK
            language: node
            folder: node-africastalking
            run: bun install && node send-and-verify.js
          # AC: SM-17.5
          - client: AWS SDK SNS client
            language: node
            folder: node-sns
            run: bun install && node send-and-verify.js
          # AC: SM-18.5
          - client: WhatsApp Cloud API over HTTP
            language: node
            folder: node-whatsapp-cloud
            run: node send-and-verify.js
          # AC: VF-05.4
          - client: Vonage Verify2 Node SDK
            language: node
            folder: node-vonage-verify
            run: bun install && node send-and-verify.js
    env:
      SENDMOCK_URL: http://127.0.0.1:8025
      SENDMOCK_PROVIDER_URL: http://127.0.0.1:8026
    steps:
      - if: needs.changes.outputs.is_affected == 'true'
        uses: actions/checkout@v7

      - if: needs.changes.outputs.is_affected == 'true'
        uses: actions/download-artifact@v8
        with:
          name: sendmock-for-sms-clients
          path: sendmock-binary

      - if: needs.changes.outputs.is_affected == 'true'
        uses: oven-sh/setup-bun@v2

      - if: needs.changes.outputs.is_affected == 'true'
        name: Start SendMock with the provider port
        run: |
          chmod +x sendmock-binary/sendmock
          ./sendmock-binary/sendmock --db memory --provider-addr 127.0.0.1:8026 > sendmock.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8025/api/v1/health > /dev/null && exit 0
            sleep 1
          done
          cat sendmock.log
          exit 1

      - uses: actions/setup-node@v7
        if: ${{ (matrix.language == 'node') && needs.changes.outputs.is_affected == 'true' }}
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        if: ${{ (matrix.language == 'python') && needs.changes.outputs.is_affected == 'true' }}
        with:
          python-version: "3.13"

      - uses: shivammathur/setup-php@v2
        if: ${{ (matrix.language == 'php') && needs.changes.outputs.is_affected == 'true' }}
        with:
          php-version: "8.3"
          tools: composer

      - uses: actions/setup-go@v7
        if: ${{ (matrix.language == 'go') && needs.changes.outputs.is_affected == 'true' }}
        with:
          go-version: "1.23"
          cache-dependency-path: examples/sms/go-twilio/go.sum

      - uses: actions/setup-java@v6
        if: ${{ (matrix.language == 'java') && needs.changes.outputs.is_affected == 'true' }}
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-dotnet@v6
        if: ${{ (matrix.language == 'dotnet') && needs.changes.outputs.is_affected == 'true' }}
        with:
          dotnet-version: "8.0.x"

      - uses: ruby/setup-ruby@v1
        if: ${{ (matrix.language == 'ruby') && needs.changes.outputs.is_affected == 'true' }}
        with:
          ruby-version: "3.3"

      - if: needs.changes.outputs.is_affected == 'true'
        name: Send and verify with the ${{ matrix.client }}
        working-directory: examples/sms/${{ matrix.folder }}
        run: ${{ matrix.run }}

      - name: SendMock log
        if: ${{ (failure()) && needs.changes.outputs.is_affected == 'true' }}
        run: cat sendmock.log

  # A required check like every job above: it fails unless each job passed or was skipped.
  passed:
    name: SMS clients passed
    if: always()
    needs:
      - changes
      - binary
      - client
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(echo "$JOB_RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed_jobs" ]; then
            echo "::error::Not every job passed: $failed_jobs"
            exit 1
          fi
