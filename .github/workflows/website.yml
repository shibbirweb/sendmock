# Builds the website (website/, Fumadocs) with the mock-mode web app at /demo/ and
# publishes it to GitHub Pages (docs/plan/16-website-and-releases.md).
#
# Every deploy builds every docs version (WS-03.4, WS-03.5): / is the newest stable
# tag (a Preview from develop until the first one), /next/ is develop, /vX.Y/ the older
# minors. Deploys always check out develop, since /next/ and the website code come from it.
#
# Set up once: Settings > Pages > Build and deployment > Source: GitHub Actions, then
# Settings > Environments > github-pages > Deployment branches and tags: allow develop,
# main and the tags v* (a release published by hand runs on its tag).
name: Website
run-name: ${{ github.event_name == 'pull_request' && 'Build the website' || 'Publish the website' }}

on:
  push:
    branches: [develop]
    paths:
      - "web/**"
      - "website/**"
      - "docs/api/**"
      - "docs/wiki/**"
      - "scripts/build-pages-site.ts"
      - "scripts/build-docs-versions.ts"
      - "scripts/release/package-repository.sh"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "web/**"
      - "website/**"
      - "docs/api/**"
      - "docs/wiki/**"
      - "scripts/build-pages-site.ts"
      - "scripts/build-docs-versions.ts"
      - ".github/workflows/website.yml"
  # A new stable release becomes / and the previous minor moves to /vX.Y/.
  release:
    types: [published]
  # The release workflows publish with GITHUB_TOKEN, whose events start no other workflow, so
  # the trigger above misses them; this one follows their run instead.
  workflow_run:
    workflows: [Publish beta, Publish stable]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Publish beta and Publish stable run after every CI run on develop and main; deploy only
  # when the run published a release, as Registry publish decides.
  release-check:
    name: Did that run publish a release?
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_deploy: ${{ steps.decision.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | {name, conclusion}' > "$RUNNER_TEMP/run-jobs.jsonl"
          bun scripts/release/registry-publish-plan.ts "$WORKFLOW_NAME" "$RUNNER_TEMP/run-jobs.jsonl"

  # Our signed APT and YUM repository under /packages/, rebuilt on every deploy from the newest
  # stable and the newest beta release's .deb and .rpm files, once the owner has set
  # PACKAGES_GPG_PRIVATE_KEY (DS-03.3, plan 30 W4).
  package-repository:
    name: APT and YUM repository
    needs: release-check
    if: ${{ !cancelled() && (needs.release-check.result == 'skipped' || needs.release-check.outputs.should_deploy == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      has_repository: ${{ steps.build.outputs.has_repository }}
    env:
      HAS_SIGNING_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true'

      - name: Download the newest stable and beta packages and build the repository
        id: build
        if: github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get install -y -qq apt-utils createrepo-c > /dev/null
          echo "$SIGNING_KEY" | gpg --batch --import
          releases_json="$(gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease)"
          stable_tag="$(echo "$releases_json" | jq -r '[.[] | select(.isPrerelease | not) | select(.tagName | test("^v[0-9]"))][0].tagName // empty')"
          beta_tag="$(echo "$releases_json" | jq -r '[.[] | select(.tagName | test("^v[0-9].*-beta"))][0].tagName // empty')"
          for channel in stable beta; do
            mkdir -p "channels/$channel"
            channel_tag="$stable_tag"
            if [ "$channel" = "beta" ]; then channel_tag="$beta_tag"; fi
            if [ -n "$channel_tag" ]; then
              gh release download "$channel_tag" --dir "channels/$channel" --pattern '*.deb' --pattern '*.rpm'
            fi
          done
          if ls channels/*/*.deb > /dev/null 2>&1; then
            sh scripts/release/package-repository.sh channels package-repository "https://shibbirweb.github.io/${{ github.event.repository.name }}/packages"
            echo "has_repository=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.has_repository == 'true'
        with:
          name: package-repository
          path: package-repository
          retention-days: 1

  build:
    name: Build
    needs: package-repository
    runs-on: ubuntu-latest
    # Playwright's own image has the browser and its system packages, as in ci.yml.
    # The tag must equal @playwright/test in website/package.json; web/tests/repository checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      # Without git, checkout downloads files with no history; the docs versions
      # need the tags and git worktree.
      - name: Install git
        run: |
          if ! command -v git >/dev/null; then
            apt-get update
            apt-get install --yes --no-install-recommends git
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name != 'pull_request' && 'develop' || '' }}
          fetch-depth: 0

      # The image has Node but not unzip, which setup-bun needs, so Bun comes from npm.
      - name: Install Bun
        run: npm install -g bun

      - name: Install web app
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install website
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Unit tests (snippets, docs versions)
        working-directory: website
        run: bun run test:unit

      - name: Landing, docs and API playground tests (WS-02, WS-03.3, WS-04)
        working-directory: website
        run: bun run test:e2e

      # Uses the root build (with the demo) the tests just made; the Pages build below replaces it.
      # The image has Playwright's Chromium, not Google Chrome, and runs as root,
      # which Chrome allows only without its sandbox.
      - name: Lighthouse at least 90 in every category (WS-02.3)
        working-directory: website
        run: |
          chrome_path=$(find /ms-playwright -path "*/chromium-*/*" -type f -name chrome | head -1)
          if [ -z "$chrome_path" ]; then
            echo "Playwright's Chromium was not found under /ms-playwright." >&2
            exit 1
          fi
          # Lighthouse CI's health check finds Chrome only through CHROME_PATH.
          export CHROME_PATH="$chrome_path"
          bunx --bun @lhci/cli@0.15.1 autorun --collect.chromePath="$chrome_path" --collect.settings.chromeFlags="--headless=new --no-sandbox"

      - name: Lighthouse scores test (names WS-02.3)
        working-directory: website
        run: bun run test:lighthouse

      # Pull requests only build the working tree, as the Preview, to catch broken pages.
      - name: Build website with the demo at /demo/
        if: github.event_name == 'pull_request'
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: bun scripts/build-pages-site.ts

      - name: Build every docs version, each with its demo
        if: github.event_name != 'pull_request'
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          # The checkout belongs to another user than the container's root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bun scripts/build-docs-versions.ts

      - name: Our APT and YUM repository at /packages/
        if: github.event_name != 'pull_request' && needs.package-repository.outputs.has_repository == 'true'
        uses: actions/download-artifact@v8
        with:
          name: package-repository
          path: website/out/packages

      - name: Upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
