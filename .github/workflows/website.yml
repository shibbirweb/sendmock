# Builds the website (website/, Fumadocs) with the mock-mode web app at /demo/ and
# publishes it to GitHub Pages (docs/plan/16-website-and-releases.md).
#
# Until the versioned builds land in Phase 0 (/ = stable, /next/ = develop), the site
# is published from develop so the UI preview is always the latest work.
#
# Set up once: Settings > Pages > Build and deployment > Source: GitHub Actions, then
# Settings > Environments > github-pages > Deployment branches: allow develop and main.
name: Website
run-name: ${{ github.event_name == 'pull_request' && 'Build the website' || 'Publish the website' }}

on:
  push:
    branches: [develop]
    paths:
      - "web/**"
      - "website/**"
      - "docs/api/**"
      - "scripts/build-pages-site.ts"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "web/**"
      - "website/**"
      - "docs/api/**"
      - "scripts/build-pages-site.ts"
      - ".github/workflows/website.yml"
  workflow_dispatch:

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install web app
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install website
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: website
        run: bunx --bun playwright install --with-deps chromium

      - name: Unit tests (snippets)
        working-directory: website
        run: bun run test:unit

      - name: Landing, docs and API playground tests (WS-02, WS-03.3, WS-04)
        working-directory: website
        run: bun run test:e2e

      # Uses the root build (with the demo) the tests just made; the Pages build below replaces it.
      - name: Lighthouse at least 90 in every category (WS-02.3)
        working-directory: website
        run: bunx --bun @lhci/cli@0.15.1 autorun

      - name: Lighthouse scores test (names WS-02.3)
        working-directory: website
        run: bun run test:lighthouse

      - name: Build website with the demo at /demo/
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: bun scripts/build-pages-site.ts

      - name: Upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
