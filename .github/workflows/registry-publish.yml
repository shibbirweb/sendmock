# Publishes to the registries that log in with GitHub OIDC (trusted publishing): npm, PyPI,
# NuGet, crates.io and the official MCP registry. Registries check the workflow file named in the OIDC
# token and cannot trust a called workflow, so these jobs live in this top-level workflow, the
# one file registered as trusted publisher on each registry (docs/plan/30-phase-5.md, W18). It
# runs after "Publish beta" or "Publish stable" and only when that run published a release.
name: Registry publish

on:
  workflow_run:
    workflows: [Publish beta, Publish stable]
    types: [completed]
  # Sends a release the registries missed again. Re-running a failed run would reuse its old
  # workflow file, so a fix to this file only reaches that release through a new run.
  workflow_dispatch:
    inputs:
      release_run_id:
        description: ID of the Publish beta or Publish stable run that released the version
        required: true
        type: string
      registries:
        description: Which registries to send it to; crates sends only the crates.io job
        required: false
        type: choice
        default: all
        options:
          - all
          - crates

permissions:
  contents: read

concurrency:
  group: registry-publish
  cancel-in-progress: false

env:
  RELEASE_RUN_ID: ${{ github.event.workflow_run.id || inputs.release_run_id }}

jobs:
  plan:
    name: Did that run publish a release?
    # Run by hand, it publishes only from the default branch's workflow file, never a branch's.
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_publish: ${{ steps.decision.outputs.should_publish }}
      tag_name: ${{ steps.decision.outputs.tag_name }}
      version: ${{ steps.decision.outputs.version }}
      channel: ${{ steps.decision.outputs.channel }}
      release_branch: ${{ steps.decision.outputs.release_branch }}
    steps:
      # The default branch, never the commit of the run that triggered this one: a fork's pull
      # request from a branch named develop also runs CI and then Publish beta, and its code must
      # never run here, where the plan decides what the OIDC jobs publish.
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # Any channel of the release may have failed after the GitHub release went out; the
      # registries still get it, so the gate is the publish job, not the whole run.
      - id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::release_run_id is not a workflow run ID; publishing nothing"
            exit 1
          fi
          workflow_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" --jq .name)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | {name, conclusion}' > "$RUNNER_TEMP/run-jobs.jsonl"
          bun scripts/release/registry-publish-plan.ts "$workflow_name" "$RUNNER_TEMP/run-jobs.jsonl"

      # Only the release workflows create `v*` tags here, and the Release tags ruleset stops them
      # moving. A publish workflow releases the commit of a successful push CI run on its branch,
      # so the tag must point at one. The publish run's own head commit cannot stand in for it: a
      # `workflow_run` run is recorded on the default branch head, which is never a stable's commit.
      - name: The release tag is this repository's and points at a commit CI passed on its branch
        if: steps.decision.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.decision.outputs.tag_name }}
          RELEASE_BRANCH: ${{ steps.decision.outputs.release_branch }}
        run: |
          tagged_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG_NAME" --jq .sha)"
          passed_ci_run_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$tagged_commit&branch=$RELEASE_BRANCH&event=push&status=success&per_page=1" --jq .total_count)"
          if [ "$passed_ci_run_count" = "0" ]; then
            echo "::error::$TAG_NAME points at $tagged_commit, which has no successful push CI run on $RELEASE_BRANCH; publishing nothing"
            exit 1
          fi

  # The launcher and its platform packages, with the `latest` or `beta` dist-tag (DS-03.1,
  # DS-03.7), once the owner has made this workflow each package's trusted publisher.
  npm:
    name: npm packages
    needs: plan
    if: inputs.registries != 'crates' && needs.plan.outputs.should_publish == 'true' && vars.NPM_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag_name }}

      - uses: oven-sh/setup-bun@v2

      # No registry-url: setup-node would write an `_authToken=${NODE_AUTH_TOKEN}` line, and an
      # empty one makes npm skip the OIDC exchange.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm with trusted and staged publishing and OIDC dist-tags
        run: npm install -g npm@^11.21.0

      # npm sets a trusted publisher only on an existing package, so a package's first version
      # is staged with NPM_TOKEN (scripts/release/npm-publish.ts) and approved by the owner; once
      # the owner has set the trusted publishers and deleted the secret, no token is written and
      # npm uses OIDC.
      - name: The first publish's token, while NPM_TOKEN is set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
          fi

      - name: The release's archives, from the run that built and tested them
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
          run-id: ${{ env.RELEASE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Publish the platform packages, then the launcher
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          dist_tag="latest"
          if [ "$CHANNEL" = "beta" ]; then dist_tag="beta"; fi
          bun scripts/release/npm-packages.ts "$VERSION" dist npm-packages
          for package_directory in ./npm-packages/*/; do
            if [ "$(basename "$package_directory")" != "sendmock" ]; then
              bun scripts/release/npm-publish.ts "$package_directory" "$dist_tag"
            fi
          done
          bun scripts/release/npm-publish.ts ./npm-packages/sendmock/ "$dist_tag"

  # The server in the official MCP registry for a stable, once the npm package and the image it
  # names are published (the registry checks both claim its name); GitHub OIDC proves the
  # io.github.shibbirweb namespace, so no token is kept (AI-05.6).
  mcp-registry:
    name: MCP registry
    needs: [plan, npm]
    if: inputs.registries != 'crates' && needs.plan.outputs.should_publish == 'true' && needs.plan.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag_name }}

      - uses: ./.github/actions/install-mcp-publisher

      - uses: oven-sh/setup-bun@v2

      - name: server.json names this release, and its image is published
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          grep -q "ghcr.io/shibbirweb/sendmock:$VERSION\"" server.json
          docker buildx imagetools inspect "ghcr.io/shibbirweb/sendmock:$VERSION" > /dev/null

      # npm does not serve a version the moment it is published, and the MCP registry checks it
      # there, so the script waits for npm first and retries while the registry cannot see it (#355).
      - name: Publish to the MCP registry once npm serves the version
        timeout-minutes: 40
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bun scripts/release/mcp-registry-publish.ts "$VERSION"

  # crates.io trusted publishing refuses a `workflow_run` OIDC token, so a stable that came in
  # through `workflow_run` starts a hand run of this same file for its crates, on the default
  # branch the trusted publisher names; `workflow_dispatch` is the one event a GITHUB_TOKEN can
  # start a run with.
  crates-handoff:
    name: crates.io (sent to a hand-started run)
    needs: plan
    if: github.event_name == 'workflow_run' && needs.plan.outputs.should_publish == 'true' && needs.plan.outputs.channel == 'stable' && vars.CRATES_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start this workflow for crates.io only
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run registry-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f release_run_id="$RELEASE_RUN_ID" -f registries=crates

  # The crates on crates.io for a stable (`cargo install sendmock`, DS-03.1).
  crates:
    name: crates.io
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.should_publish == 'true' && needs.plan.outputs.channel == 'stable' && vars.CRATES_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      HAS_FIRST_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag_name }}

      - name: The web UI the release embedded
        uses: actions/download-artifact@v8
        with:
          name: release-web-dist
          path: web/dist
          run-id: ${{ env.RELEASE_RUN_ID }}
          github-token: ${{ github.token }}

      - uses: oven-sh/setup-bun@v2

      - name: Toolchain
        run: rustup toolchain install

      - name: Put the UI and the skill inside the crates that embed them
        run: sh scripts/release/stage-crate-files.sh

      # crates.io sets a trusted publisher only on a crate that exists, so the first release
      # publishes with CARGO_REGISTRY_TOKEN; once the owner has set the trusted publishers and
      # deleted the secret, the OIDC token is used.
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
        if: env.HAS_FIRST_PUBLISH_TOKEN != 'true'

      - name: Publish every crate in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-io-auth.outputs.token }}
        run: bun scripts/release/crates-publish.ts

  # The Node Testcontainers module (DS-06).
  testcontainers-node:
    name: npm (sendmock-testcontainers)
    needs: plan
    if: inputs.registries != 'crates' && needs.plan.outputs.should_publish == 'true' && vars.NPM_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag_name }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: npm with trusted and staged publishing and OIDC dist-tags
        run: npm install -g npm@^11.21.0

      - name: The first publish's token, while NPM_TOKEN is set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
          fi

      - name: Build and publish
        working-directory: testcontainers/node
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          dist_tag="latest"
          if [ "$CHANNEL" = "beta" ]; then dist_tag="beta"; fi
          bun install
          bun run build
          bun ../../scripts/release/npm-publish.ts . "$dist_tag"

  # The Python Testcontainers module (DS-06).
  testcontainers-python:
    name: PyPI (sendmock-testcontainers)
    needs: plan
    if: inputs.registries != 'crates' && needs.plan.outputs.should_publish == 'true' && vars.PYPI_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the wheel and the source archive
        working-directory: testcontainers/python
        run: |
          pip install --quiet build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: testcontainers/python/dist

  # The .NET Testcontainers module (DS-06): NuGet/login trades the OIDC token for a short-lived
  # key under the owner's trusted publishing policy for SendMock.Testcontainers.
  testcontainers-dotnet:
    name: NuGet (SendMock.Testcontainers)
    needs: plan
    if: inputs.registries != 'crates' && needs.plan.outputs.should_publish == 'true' && vars.NUGET_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: shibbirweb

      - name: Pack and push
        working-directory: testcontainers/dotnet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet pack SendMock.Testcontainers --configuration Release --output out
          dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
