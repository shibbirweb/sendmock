# The tray app (DS-08) with its GUI: built, linted and tested on Linux, macOS and Windows, with
# the GTK and AppIndicator libraries tray-icon needs on Linux. The workspace's own Rust jobs test
# the tray's library without the GUI. Also checks the sendmock binary itself pulls in no GUI
# crate. Runs on changes to the tray crate, the lock file or this workflow.
name: Tray app

on:
  pull_request:
  push:
    branches:
      - develop
      - main
    paths:
      - crates/sendmock-tray/**
      - Cargo.lock
      - .github/workflows/tray-app.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      is_affected: ${{ steps.changed-paths.outputs.is_affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci

      - id: changed-paths
        uses: ./.github/actions/changed-paths
        with:
          run-every-job: ${{ github.event_name != 'pull_request' }}
          paths: |
            crates/sendmock-tray/**
            Cargo.lock
            .github/workflows/tray-app.yml

  tray:
    name: Tray app (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ needs.changes.outputs.is_affected == 'true' && matrix.os || 'ubuntu-latest' }}
    steps:
      - if: needs.changes.outputs.is_affected == 'true'
        uses: actions/checkout@v7

      - name: GTK, AppIndicator and xdo for tray-icon
        if: ${{ (runner.os == 'Linux') && needs.changes.outputs.is_affected == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - if: needs.changes.outputs.is_affected == 'true'
        name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - if: needs.changes.outputs.is_affected == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - if: needs.changes.outputs.is_affected == 'true'
        name: Lint the tray app with its GUI
        run: cargo clippy -p sendmock-tray --all-targets --features gui --locked -- -D warnings

      - if: needs.changes.outputs.is_affected == 'true'
        name: Test the tray app
        run: cargo test -p sendmock-tray --features gui --locked

      - if: needs.changes.outputs.is_affected == 'true'
        name: Release build of the tray app
        run: cargo build -p sendmock-tray --features gui --release --locked

      - if: needs.changes.outputs.is_affected == 'true'
        name: The sendmock binary has no GUI dependency
        shell: bash
        run: |
          gui_crates=$(cargo tree -p sendmock -e normal --locked | grep -E "tray-icon|tao |muda|gtk" || true)
          if [ -n "$gui_crates" ]; then
            echo "::error::sendmock depends on GUI crates: $gui_crates"
            exit 1
          fi

  # A required check like every job above: it fails unless each job passed or was skipped.
  passed:
    name: Tray app passed
    if: always()
    needs:
      - changes
      - tray
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(echo "$JOB_RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed_jobs" ]; then
            echo "::error::Not every job passed: $failed_jobs"
            exit 1
          fi
