# The push providers' official Node SDKs (firebase-admin, expo-server-sdk and OneSignal's) send
# to a SendMock release binary that cannot reach the network, every notification is read back
# with GET /api/v1/wait/push, and a magic unregistered token gets each provider's own error
# (PN-01.1 to PN-01.4). Runs on changes to the push code, the provider routes or the example,
# and from Release build before anything is published.
name: Push SDKs

on:
  pull_request:
  push:
    branches:
      - develop
      - main
    paths:
      - crates/sendmock-ops/src/providers/**
      - crates/sendmock-ops/src/push/**
      - crates/sendmock-api/src/provider_routes.rs
      - examples/push/**
      - .github/actions/**
      - .github/workflows/push-sdks.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      run_every_job:
        description: Run every job without reading the pull request's changes (a calling workflow decides)
        type: boolean
        default: true
      skip_every_job:
        description: Report every job with its steps skipped, when the calling workflow has nothing to do
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      is_affected: ${{ steps.changed-paths.outputs.is_affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci

      - id: changed-paths
        uses: ./.github/actions/changed-paths
        with:
          run-every-job: ${{ github.event_name != 'pull_request' || inputs.run_every_job == true }}
          skip-every-job: ${{ inputs.skip_every_job == true }}
          paths: |
            crates/sendmock-ops/src/providers/**
            crates/sendmock-ops/src/push/**
            crates/sendmock-api/src/provider_routes.rs
            examples/push/**
            .github/actions/**
            .github/workflows/push-sdks.yml

  sdks:
    name: Three push provider SDKs offline
    needs: changes
    runs-on: ubuntu-latest
    env:
      SENDMOCK_URL: http://127.0.0.1:8025
      SENDMOCK_PROVIDER_URL: http://127.0.0.1:8026
      EXPO_BASE_URL: http://127.0.0.1:8026
    steps:
      - if: needs.changes.outputs.is_affected == 'true'
        uses: actions/checkout@v7

      - if: needs.changes.outputs.is_affected == 'true'
        uses: oven-sh/setup-bun@v2

      - if: needs.changes.outputs.is_affected == 'true'
        name: Live UI the binary embeds
        working-directory: web
        env:
          VITE_API_MODE: live
        run: |
          bun install --frozen-lockfile
          bun run build

      - if: needs.changes.outputs.is_affected == 'true'
        name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - if: needs.changes.outputs.is_affected == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - if: needs.changes.outputs.is_affected == 'true'
        name: Release build
        run: cargo build --release --locked -p sendmock

      - if: needs.changes.outputs.is_affected == 'true'
        uses: ./.github/actions/start-sendmock-offline

      - if: needs.changes.outputs.is_affected == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - if: needs.changes.outputs.is_affected == 'true'
        name: Send with firebase-admin, expo-server-sdk and OneSignal's SDK
        working-directory: examples/push/node
        run: bun install && node done-when.js

      - if: needs.changes.outputs.is_affected == 'true'
        uses: ./.github/actions/check-sendmock-offline

      - name: SendMock log
        if: ${{ (failure()) && needs.changes.outputs.is_affected == 'true' }}
        run: cat sendmock.log

  # A required check like every job above: it fails unless each job passed or was skipped.
  passed:
    name: Push SDKs passed
    if: always()
    needs:
      - changes
      - sdks
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(echo "$JOB_RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed_jobs" ]; then
            echo "::error::Not every job passed: $failed_jobs"
            exit 1
          fi
