# Real mailers in eight languages send to a SendMock release binary, and each message is
# checked through the API (EM-01.5, EM-06.2, the Phase 1 done-when check). Runs on changes
# to the SMTP code or the examples, and from Release build before anything is published.
name: SMTP clients

on:
  pull_request:
  push:
    branches:
      - develop
      - main
    paths:
      - crates/sendmock-smtp/**
      - crates/sendmock-pop3/**
      - crates/sendmock-mail/**
      - examples/smtp/**
      - .github/workflows/smtp-clients.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      run_every_job:
        description: Run every job without reading the pull request's changes (a calling workflow decides)
        type: boolean
        default: true
      skip_every_job:
        description: Report every job with its steps skipped, when the calling workflow has nothing to do
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      is_affected: ${{ steps.changed-paths.outputs.is_affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci

      - id: changed-paths
        uses: ./.github/actions/changed-paths
        with:
          run-every-job: ${{ github.event_name != 'pull_request' || inputs.run_every_job == true }}
          skip-every-job: ${{ inputs.skip_every_job == true }}
          paths: |
            crates/sendmock-smtp/**
            crates/sendmock-pop3/**
            crates/sendmock-mail/**
            crates/sendmock/src/sendmail_shim.rs
            crates/sendmock/src/sendmail_shim/**
            examples/smtp/**
            .github/workflows/smtp-clients.yml

  binary:
    name: Release binary
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.is_affected == 'true'
        uses: actions/checkout@v7

      - if: needs.changes.outputs.is_affected == 'true'
        uses: oven-sh/setup-bun@v2

      - if: needs.changes.outputs.is_affected == 'true'
        name: Live UI the binary embeds
        working-directory: web
        env:
          VITE_API_MODE: live
        run: |
          bun install --frozen-lockfile
          bun run build

      - if: needs.changes.outputs.is_affected == 'true'
        name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - if: needs.changes.outputs.is_affected == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - if: needs.changes.outputs.is_affected == 'true'
        name: Release build
        run: cargo build --release --locked -p sendmock

      - if: needs.changes.outputs.is_affected == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sendmock-for-clients
          path: target/release/sendmock
          retention-days: 1

  client:
    name: ${{ matrix.client }}
    needs: [changes, binary]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: Laravel
            language: php
            folder: php-laravel
            run: ./send-with-laravel.sh
          - client: Symfony Mailer
            language: php
            folder: php-symfony
            run: composer install --no-interaction --quiet && php send.php
          - client: PHP mail() through sendmail
            language: php
            folder: php-mail
            run: php -d sendmail_path="$GITHUB_WORKSPACE/sendmock-binary/sendmock sendmail -t -i" send.php
          - client: Nodemailer
            language: node
            folder: node-nodemailer
            run: bun install && node send.js
          - client: Python smtplib
            language: python
            folder: python-smtplib
            run: python send.py
          - client: Django
            language: python
            folder: python-django
            run: pip install --quiet -r requirements.txt && python send.py
          - client: Python poplib reads the mailbox
            language: python
            folder: python-poplib
            run: python verify.py
            checks_itself: true
          - client: pytest reads the OTP
            language: python
            folder: python-pytest
            run: pip install --quiet -r requirements.txt && pytest -q
            checks_itself: true
          - client: Go net/smtp
            language: go
            folder: go-net-smtp
            run: go run .
          - client: Spring
            language: java
            folder: java-spring
            run: mvn --quiet --batch-mode compile org.codehaus.mojo:exec-maven-plugin:3.5.1:java
          - client: lettre
            language: rust
            folder: rust-lettre
            run: cargo run --quiet
          - client: Action Mailer (Rails)
            language: ruby
            folder: ruby-action-mailer
            run: bundle install --quiet && bundle exec ruby send.rb
          - client: MailKit
            language: dotnet
            folder: dotnet-mailkit
            run: dotnet run
    env:
      SUBJECT: From ${{ matrix.client }}
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SENDMOCK_SMTP_ADDR: 127.0.0.1:1025
      # POP3 is off by default; the poplib client reads the mail through it (EM-21.6).
      SENDMOCK_POP3_ADDR: 127.0.0.1:1110
    steps:
      - if: needs.changes.outputs.is_affected == 'true'
        uses: actions/checkout@v7

      - if: needs.changes.outputs.is_affected == 'true'
        uses: actions/download-artifact@v8
        with:
          name: sendmock-for-clients
          path: sendmock-binary

      - if: needs.changes.outputs.is_affected == 'true'
        uses: oven-sh/setup-bun@v2

      - if: needs.changes.outputs.is_affected == 'true'
        name: Start SendMock with its default settings
        run: |
          chmod +x sendmock-binary/sendmock
          ./sendmock-binary/sendmock --db memory > sendmock.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8025/api/v1/health > /dev/null && exit 0
            sleep 1
          done
          cat sendmock.log
          exit 1

      - uses: shivammathur/setup-php@v2
        if: ${{ (matrix.language == 'php') && needs.changes.outputs.is_affected == 'true' }}
        with:
          php-version: "8.3"
          tools: composer

      - uses: actions/setup-node@v7
        if: ${{ (matrix.language == 'node') && needs.changes.outputs.is_affected == 'true' }}
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        if: ${{ (matrix.language == 'python') && needs.changes.outputs.is_affected == 'true' }}
        with:
          python-version: "3.13"

      - uses: actions/setup-go@v7
        if: ${{ (matrix.language == 'go') && needs.changes.outputs.is_affected == 'true' }}
        with:
          go-version: "1.23"

      - uses: actions/setup-java@v6
        if: ${{ (matrix.language == 'java') && needs.changes.outputs.is_affected == 'true' }}
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@v1
        if: ${{ (matrix.language == 'ruby') && needs.changes.outputs.is_affected == 'true' }}
        with:
          ruby-version: "3.3"

      - uses: actions/setup-dotnet@v6
        if: ${{ (matrix.language == 'dotnet') && needs.changes.outputs.is_affected == 'true' }}
        with:
          dotnet-version: "8.0.x"

      - if: needs.changes.outputs.is_affected == 'true'
        name: Send with ${{ matrix.client }}
        working-directory: examples/smtp/${{ matrix.folder }}
        run: ${{ matrix.run }}

      - name: SendMock stored it, with the code extracted
        if: ${{ (!matrix.checks_itself) && needs.changes.outputs.is_affected == 'true' }}
        run: bun examples/smtp/check-received.ts "$SUBJECT"

      - name: SendMock log
        if: ${{ (failure()) && needs.changes.outputs.is_affected == 'true' }}
        run: cat sendmock.log

  # A required check like every job above: it fails unless each job passed or was skipped.
  passed:
    name: SMTP clients passed
    if: always()
    needs:
      - changes
      - binary
      - client
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(echo "$JOB_RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed_jobs" ]; then
            echo "::error::Not every job passed: $failed_jobs"
            exit 1
          fi
