name: CI pipeline example

on:
  pull_request:
  push:
    branches:
      - develop
      - main
    paths:
      - crates/**
      - examples/ci/**
      - .github/workflows/ci-examples.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      is_affected: ${{ steps.changed-paths.outputs.is_affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci

      - id: changed-paths
        uses: ./.github/actions/changed-paths
        with:
          run-every-job: ${{ github.event_name != 'pull_request' }}
          paths: |
            crates/**
            examples/ci/**
            .github/workflows/ci-examples.yml

  ci-example:
    name: sendmock ci run on the example shop
    needs: changes
    if: needs.changes.outputs.is_affected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Live UI the binary embeds
        working-directory: web
        env:
          VITE_API_MODE: live
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Release build
        run: cargo build --release --locked -p sendmock

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run the example both ways, and a broken app
        env:
          SENDMOCK_BINARY: ${{ github.workspace }}/target/release/sendmock
        run: examples/ci/run-ci-example-test.sh

      - name: SendMock log
        if: failure()
        run: cat sendmock-server.log || true

  # The required check: it reports on every pull request, and fails unless each job above
  # passed or was skipped because the pull request did not touch its paths.
  passed:
    name: CI pipeline example passed
    if: always()
    needs:
      - changes
      - ci-example
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(echo "$JOB_RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed_jobs" ]; then
            echo "::error::Not every job passed: $failed_jobs"
            exit 1
          fi
