# The Helm chart (DS-09): linted and rendered with every option, then installed on a kind
# cluster with the image built from this commit, where SendMock must answer its health check and
# catch an email sent over SMTP. Runs on changes to the chart, the image or this workflow.
name: Helm chart

on:
  pull_request:
    paths:
      - packaging/helm/**
      - Dockerfile
      - .github/workflows/helm-chart.yml
  push:
    branches:
      - develop
      - main
    paths:
      - packaging/helm/**
      - Dockerfile
      - .github/workflows/helm-chart.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART: packaging/helm/sendmock
  EVERY_OPTION: >-
    --set persistence.enabled=true
    --set providerPort.enabled=true
    --set ingress.enabled=true
    --set ingress.host=sendmock.example.test
    --set env.SENDMOCK_MAX_EMAILS=500
    --set resources.requests.memory=64Mi

jobs:
  chart:
    name: Lint, render and install on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Lint with the defaults and with every option
        run: |
          helm lint "$CHART"
          helm lint "$CHART" $EVERY_OPTION

      - name: Render with every option
        run: |
          helm template sendmock "$CHART" $EVERY_OPTION > rendered.yaml
          for expected in "kind: PersistentVolumeClaim" "kind: Ingress" "SENDMOCK_PROVIDER_ADDR" \
            "SENDMOCK_MAX_EMAILS" "readOnlyRootFilesystem: true" "path: /api/v1/health"; do
            grep -q "$expected" rendered.yaml || { echo "::error::rendered chart lacks $expected"; exit 1; }
          done

      - uses: docker/setup-buildx-action@v3

      - name: Build the image from this commit
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sendmock:chart-test
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=helm-chart

      - uses: helm/kind-action@v1

      - name: The rendered chart is valid for the cluster's API
        run: kubectl apply --dry-run=server -f rendered.yaml

      - name: Install the chart with persistence
        run: |
          kind load docker-image sendmock:chart-test --name chart-testing
          helm install sendmock "$CHART" --wait --timeout 3m \
            --set image.repository=sendmock --set image.tag=chart-test \
            --set image.pullPolicy=Never --set persistence.enabled=true

      - name: Healthy, and an email over SMTP is caught
        run: |
          kubectl port-forward service/sendmock 8025:8025 1025:1025 > port-forward.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8025/api/v1/health > /dev/null && break
            sleep 1
          done
          printf 'From: app@shop.test\r\nTo: sam@example.test\r\nSubject: Chart test\r\n\r\nHello from kind\r\n' > mail.txt
          curl -fsS --url smtp://127.0.0.1:1025 --mail-from app@shop.test \
            --mail-rcpt sam@example.test --upload-file mail.txt
          email_count=$(curl -fsS "http://127.0.0.1:8025/api/v1/emails?limit=1" | jq -r .total_count)
          test "$email_count" = "1"

      - name: Pod log
        if: failure()
        run: kubectl logs deployment/sendmock --tail=100 || true
