# The Testcontainers modules for Java, Node, Go, Python and .NET start the image built from
# this commit and reach its SMTP, HTTP and provider addresses (DS-06.1). Runs on changes to the
# modules, the Dockerfile or the binary.
name: Testcontainers

on:
  pull_request:
  push:
    branches:
      - develop
      - main
    paths:
      - testcontainers/**
      - Dockerfile
      - crates/sendmock/**
      - .github/workflows/testcontainers.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SENDMOCK_IMAGE: sendmock:testcontainers

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      is_affected: ${{ steps.changed-paths.outputs.is_affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci

      - id: changed-paths
        uses: ./.github/actions/changed-paths
        with:
          run-every-job: ${{ github.event_name != 'pull_request' }}
          paths: |
            testcontainers/**
            Dockerfile
            crates/sendmock/**
            .github/workflows/testcontainers.yml

  image:
    name: Image from this commit
    needs: changes
    if: needs.changes.outputs.is_affected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ env.SENDMOCK_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/sendmock-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v7
        with:
          name: sendmock-image
          path: ${{ runner.temp }}/sendmock-image.tar
          retention-days: 1

  module:
    name: ${{ matrix.module }}
    needs: image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: Java
            language: java
            folder: java
            run: mvn --batch-mode --quiet test
            # Builds the Central bundle as the release does, without uploading it. Central rejects
            # a bundle with any file outside the version folder (Maven 3.10 added one, #219).
            pack: >-
              mvn --batch-mode --quiet -P release -Dgpg.skip -DskipTests -DskipUpload deploy &&
              ls target/sendmock-testcontainers-*-sources.jar target/sendmock-testcontainers-*-javadoc.jar &&
              unzip -Z1 target/central-publishing/central-bundle.zip > "$RUNNER_TEMP/central-bundle-files.txt" &&
              grep -q -E "/sendmock-testcontainers-[^/]+\.pom$" "$RUNNER_TEMP/central-bundle-files.txt" &&
              ! grep -v -E "^io/github/shibbirweb/sendmock-testcontainers/[^/]+/[^/]+$" "$RUNNER_TEMP/central-bundle-files.txt"
          - module: Node
            language: node
            folder: node
            run: bun install && node --test 'test/*.test.ts'
            pack: >-
              bun run build && npm pack && mkdir "$RUNNER_TEMP/node-project" && cp sendmock-testcontainers-*.tgz "$RUNNER_TEMP/node-project/" &&
              cd "$RUNNER_TEMP/node-project" && npm init -y > /dev/null && npm install ./sendmock-testcontainers-*.tgz &&
              node -e "import('sendmock-testcontainers').then((module) => { if (typeof module.SendMockContainer !== 'function') { process.exit(1); } })"
          - module: Go
            language: go
            folder: go
            run: go test ./...
            pack: go vet ./... && go mod verify
          - module: Python
            language: python
            folder: python
            run: pip install --quiet ".[test]" && pytest -q
            pack: >-
              pip install --quiet build && python -m build && python -m venv "$RUNNER_TEMP/python-project" &&
              "$RUNNER_TEMP/python-project/bin/pip" install --quiet dist/*.whl &&
              "$RUNNER_TEMP/python-project/bin/python" -c "from sendmock_testcontainers import SendMockContainer"
          - module: .NET
            language: dotnet
            folder: dotnet
            run: dotnet test SendMock.Testcontainers.Tests
            pack: dotnet pack SendMock.Testcontainers --configuration Release --output out && unzip -l out/SendMock.Testcontainers.*.nupkg | grep -q "lib/.*/SendMock.Testcontainers.dll"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: sendmock-image
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/sendmock-image.tar"

      - uses: oven-sh/setup-bun@v2
        if: matrix.language == 'node'

      - uses: actions/setup-node@v7
        if: matrix.language == 'node'
        with:
          node-version: "24"

      - uses: actions/setup-java@v6
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: "1.26"

      - uses: actions/setup-python@v7
        if: matrix.language == 'python'
        with:
          python-version: "3.13"

      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'dotnet'
        with:
          dotnet-version: "8.0.x"

      - name: Test the ${{ matrix.module }} module
        working-directory: testcontainers/${{ matrix.folder }}
        run: ${{ matrix.run }}

      # AC: DS-06.1
      - name: Package the ${{ matrix.module }} module as its registry would and load the package
        working-directory: testcontainers/${{ matrix.folder }}
        run: ${{ matrix.pack }}

  # The required check: it reports on every pull request, and fails unless each job above
  # passed or was skipped because the pull request did not touch its paths.
  passed:
    name: Testcontainers passed
    if: always()
    needs:
      - changes
      - image
      - module
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(echo "$JOB_RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed_jobs" ]; then
            echo "::error::Not every job passed: $failed_jobs"
            exit 1
          fi
