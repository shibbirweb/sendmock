# The Testcontainers modules for Java, Node, Go, Python and .NET start the image built from
# this commit and reach its SMTP, HTTP and provider addresses (DS-06.1). Runs on changes to the
# modules, the Dockerfile or the binary.
name: Testcontainers

on:
  pull_request:
    paths:
      - testcontainers/**
      - Dockerfile
      - crates/sendmock/**
      - .github/workflows/testcontainers.yml
  push:
    branches:
      - develop
      - main
    paths:
      - testcontainers/**
      - Dockerfile
      - crates/sendmock/**
      - .github/workflows/testcontainers.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SENDMOCK_IMAGE: sendmock:testcontainers

jobs:
  image:
    name: Image from this commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.SENDMOCK_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/sendmock-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v4
        with:
          name: sendmock-image
          path: ${{ runner.temp }}/sendmock-image.tar
          retention-days: 1

  module:
    name: ${{ matrix.module }}
    needs: image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: Java
            language: java
            folder: java
            run: mvn --batch-mode --quiet test
          - module: Node
            language: node
            folder: node
            run: bun install && node --test test/
          - module: Go
            language: go
            folder: go
            run: go test ./...
          - module: Python
            language: python
            folder: python
            run: pip install --quiet ".[test]" && pytest -q
          - module: .NET
            language: dotnet
            folder: dotnet
            run: dotnet test SendMock.Testcontainers.Tests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: sendmock-image
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/sendmock-image.tar"

      - uses: oven-sh/setup-bun@v2
        if: matrix.language == 'node'

      - uses: actions/setup-node@v4
        if: matrix.language == 'node'
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: "1.25"

      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with:
          python-version: "3.13"

      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'dotnet'
        with:
          dotnet-version: "8.0.x"

      - name: Test the ${{ matrix.module }} module
        working-directory: testcontainers/${{ matrix.folder }}
        run: ${{ matrix.run }}
