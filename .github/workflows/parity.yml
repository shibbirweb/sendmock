# Every feature in every way (docs/plan/20-surface-parity.md, UI-11.7): fails when any
# REST operation lacks a CLI command, an MCP tool (outside the recorded exemption) or a
# UI place, or when the AI plan, the user guide or the spec name something that does
# not exist. Runs on its own so a gap is one clearly named check; no browser, no build.
name: Surface parity

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  parity:
    name: REST, CLI, MCP and UI for every operation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Every operation has REST, CLI, MCP and UI (summary on the job page)
        run: bun run parity

      - name: Catalogue, AI plan, user guide, mock handlers and spec agree
        run: bun run test:parity

  binary-parity:
    name: The binary matches the surface catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - uses: oven-sh/setup-bun@v2

      - name: The binary's commands and MCP tools
        run: cargo run --locked -q -p sendmock -- help --all --json > binary-surfaces.json

      - name: Same names as docs/api/cli-reference.json and mcp-tools.json (summary on the job page)
        run: bun scripts/binary-surface-parity.ts binary-surfaces.json

  # The required check: it reports on every pull request, and fails unless each job above
  # passed or was skipped because the pull request did not touch its paths.
  passed:
    name: Surface parity passed
    if: always()
    needs:
      - parity
      - binary-parity
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(echo "$JOB_RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed_jobs" ]; then
            echo "::error::Not every job passed: $failed_jobs"
            exit 1
          fi
