# Opens the develop to main pull request when develop carries an untagged stable version.
name: Promote stable

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  promote:
    name: Promote a stable to main
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - id: decision
        run: bun scripts/release/release.ts decide stable-promote

      - name: Open the pull request into main (merge commit, never squash)
        if: steps.decision.outputs.should_act == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          if [ -n "$(gh pr list --base main --head develop --state open --json number --jq '.[].number')" ]; then
            echo "A develop to main pull request is already open."
            exit 0
          fi
          release_number="$(bun scripts/release/release.ts release-number)"
          gh pr create --base main --head develop \
            --title "chore:[REL-$release_number] promote $VERSION to main" \
            --body "Merge with a merge commit, never squash, so main and develop share history. Merging publishes $VERSION."
