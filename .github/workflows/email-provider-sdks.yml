# The email providers' official Node SDKs (SendGrid, Mailgun, Postmark, Resend, SES v2 and
# Brevo) send to a SendMock release binary that cannot reach the network, each pointed at the
# provider port by its own base URL setting, and every message is read back through the API
# (EM-08.5). Runs on changes to the provider runtime, the email code or the example, and from
# Release build before anything is published.
name: Email provider SDKs

on:
  pull_request:
  push:
    branches:
      - develop
      - main
    paths:
      - crates/sendmock-ops/src/providers/**
      - crates/sendmock-ops/src/email/**
      - crates/sendmock-ops/builtin/**
      - crates/sendmock-mail/**
      - examples/email-providers/**
      - .github/actions/**
      - .github/workflows/email-provider-sdks.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      run_every_job:
        description: Run every job without reading the pull request's changes (a calling workflow decides)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      is_affected: ${{ steps.changed-paths.outputs.is_affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            scripts/ci

      - id: changed-paths
        uses: ./.github/actions/changed-paths
        with:
          run-every-job: ${{ github.event_name != 'pull_request' || inputs.run_every_job == true }}
          paths: |
            crates/sendmock-ops/src/providers/**
            crates/sendmock-ops/src/email/**
            crates/sendmock-ops/builtin/**
            crates/sendmock-mail/**
            examples/email-providers/**
            .github/actions/**
            .github/workflows/email-provider-sdks.yml

  sdks:
    name: Six email provider SDKs offline
    needs: changes
    if: needs.changes.outputs.is_affected == 'true'
    runs-on: ubuntu-latest
    env:
      SENDMOCK_URL: http://127.0.0.1:8025
      SENDMOCK_PROVIDER_URL: http://127.0.0.1:8026
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Live UI the binary embeds
        working-directory: web
        env:
          VITE_API_MODE: live
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Release build
        run: cargo build --release --locked -p sendmock

      - uses: ./.github/actions/start-sendmock-offline
        with:
          extra-args: --provider-tls-addr 127.0.0.1:8027

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Send with SendGrid, Mailgun, Postmark, Resend, SES v2 and Brevo SDKs
        working-directory: examples/email-providers/node
        run: bun install && node done-when.js

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      # AC: EM-23.6
      - name: Mailgun PHP SDK reads events and manages complaints
        working-directory: examples/email-providers/php-mailgun
        run: composer install --no-interaction --quiet && php send-and-verify.php

      # AC: PL-20.5
      - name: Laravel's mailgun mailer sends over HTTPS with the local CA trusted
        working-directory: examples/email-providers/php-laravel-mailgun-https
        run: ./send-over-https-test.sh

      - uses: ./.github/actions/check-sendmock-offline

      - name: SendMock log
        if: failure()
        run: cat sendmock.log

  # The required check: it reports on every pull request, and fails unless each job above
  # passed or was skipped because the pull request did not touch its paths.
  passed:
    name: Email provider SDKs passed
    if: always()
    needs:
      - changes
      - sdks
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failed_jobs="$(echo "$JOB_RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed_jobs" ]; then
            echo "::error::Not every job passed: $failed_jobs"
            exit 1
          fi
