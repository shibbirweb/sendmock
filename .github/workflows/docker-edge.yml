# The images are published only by a release: the release tags (`beta` and the version, or
# `latest`, the version, major.minor and major) when Release build calls this workflow, for
# linux/amd64 and linux/arm64, each built and tested on its own runner, then joined under the
# tags, signed and checked (docs/plan/09-distribution.md). Every tag has a `-debug` twin built on
# distroless's debug base. Pushes to develop and pull requests that change the image build and
# test it without publishing, and rehearse the published-image check on a registry on the runner.
name: Docker image

on:
  workflow_call:
    inputs:
      commit_sha:
        type: string
        required: true
      image_tags:
        description: Space-separated tags, such as "beta 0.1.0-beta.1"
        type: string
        required: true
      channel:
        description: Release channel baked into the binary
        type: string
        required: true
  push:
    branches: [develop]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-edge.yml
      - scripts/docker-image-test.sh
      - scripts/docker-published-check.sh

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.image_tags || 'edge' }}-${{ github.ref }}
  cancel-in-progress: ${{ inputs.image_tags == '' }}

env:
  GHCR_IMAGE: ghcr.io/shibbirweb/sendmock
  DOCKERHUB_IMAGE: docker.io/shibbirweb/sendmock
  # Only a release call publishes; pushes to develop and pull requests build and test.
  IS_PUBLISHING: ${{ inputs.image_tags != '' }}
  IMAGE_TAGS: ${{ inputs.image_tags || 'edge' }}
  RELEASE_CHANNEL: ${{ inputs.channel || 'edge' }}

jobs:
  image:
    name: Image for ${{ matrix.platform }} (${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, architecture: amd64, runner: ubuntu-latest, variant: plain, build_target: "" }
          - { platform: linux/arm64, architecture: arm64, runner: ubuntu-24.04-arm, variant: plain, build_target: "" }
          - { platform: linux/amd64, architecture: amd64, runner: ubuntu-latest, variant: debug, build_target: debug }
          - { platform: linux/arm64, architecture: arm64, runner: ubuntu-24.04-arm, variant: debug, build_target: debug }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.build_target }}
          load: true
          tags: sendmock:test
          build-args: SENDMOCK_RELEASE_CHANNEL=${{ env.RELEASE_CHANNEL }}
          cache-from: type=gha,scope=${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.architecture }}

      - name: Non-root, data in /data, healthy, the notice, mounted config and templates, a clean stop and the size
        run: scripts/docker-image-test.sh sendmock:test ${{ matrix.variant }}

      - name: Log in to GHCR
        if: env.IS_PUBLISHING == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push by digest, with an SBOM and provenance
        if: env.IS_PUBLISHING == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.build_target }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: SENDMOCK_RELEASE_CHANNEL=${{ env.RELEASE_CHANNEL }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.architecture }}

      - name: Keep the digest for the manifest
        if: env.IS_PUBLISHING == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: env.IS_PUBLISHING == 'true'
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  # The published-image check rehearsed before anything is published (DS-02.5): the commit's
  # image pushed with an SBOM and provenance to a registry on the runner, signed with a key made
  # here, then checked by the same script the manifest job runs after a real push.
  publish-rehearsal:
    name: Signed, with an SBOM and provenance, under 25 MB (rehearsal on a local registry)
    if: inputs.image_tags == ''
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      REHEARSAL_IMAGE: localhost:5000/sendmock
    steps:
      - uses: actions/checkout@v7

      # The builder shares the runner's network, so it reaches the registry on localhost.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Push by digest, with an SBOM and provenance
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ env.REHEARSAL_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: SENDMOCK_RELEASE_CHANNEL=edge
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=amd64

      - name: The tag, as the manifest job makes it
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: docker buildx imagetools create -t "$REHEARSAL_IMAGE:rehearsal" "$REHEARSAL_IMAGE@$IMAGE_DIGEST"

      - uses: sigstore/cosign-installer@v3

      - name: Sign it with a key made in this job
        id: sign
        env:
          COSIGN_PASSWORD: ""
        run: |
          cosign generate-key-pair
          manifest_digest="$(docker buildx imagetools inspect "$REHEARSAL_IMAGE:rehearsal" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "manifest_digest=$manifest_digest" >> "$GITHUB_OUTPUT"
          cosign sign --yes --key cosign.key --tlog-upload=false "$REHEARSAL_IMAGE@$manifest_digest"

      # AC: DS-02.5
      - name: The tag is signed, carries an SBOM and provenance, and is under 25 MB
        env:
          MANIFEST_DIGEST: ${{ steps.sign.outputs.manifest_digest }}
          EXPECTED_PLATFORMS: linux/amd64
          COSIGN_PUBLIC_KEY: cosign.pub
        run: bash scripts/docker-published-check.sh "$REHEARSAL_IMAGE" "$MANIFEST_DIGEST" rehearsal ""

  manifest:
    name: Tag, sign and check it (${{ matrix.variant }})
    if: inputs.image_tags != ''
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, debug]
    env:
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      TAG_SUFFIX: ${{ matrix.variant == 'debug' && '-debug' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A push would create the repository with the account's default visibility; a private one
      # breaks `docker pull` for everyone, so it is created public first. Its overview page is
      # packaging/docker/README.md.
      - name: The Docker Hub repository exists and is public
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash scripts/docker-hub-repository.sh "${DOCKERHUB_IMAGE#docker.io/}" packaging/docker/README.md

      - name: The tags for both platforms
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          for image_tag in $IMAGE_TAGS; do
            tags+=(-t "$GHCR_IMAGE:$image_tag$TAG_SUFFIX")
            if [ "$HAS_DOCKERHUB_TOKEN" = "true" ]; then tags+=(-t "$DOCKERHUB_IMAGE:$image_tag$TAG_SUFFIX"); fi
          done
          docker buildx imagetools create "${tags[@]}" $(printf "$GHCR_IMAGE@sha256:%s " *)

      - uses: sigstore/cosign-installer@v3

      - name: Sign it without a stored key (GitHub OIDC)
        id: sign
        run: |
          first_tag="${IMAGE_TAGS%% *}$TAG_SUFFIX"
          manifest_digest="$(docker buildx imagetools inspect "$GHCR_IMAGE:$first_tag" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "manifest_digest=$manifest_digest" >> "$GITHUB_OUTPUT"
          cosign sign --yes "$GHCR_IMAGE@$manifest_digest"
          if [ "$HAS_DOCKERHUB_TOKEN" = "true" ]; then cosign sign --yes "$DOCKERHUB_IMAGE@$manifest_digest"; fi

      # AC: DS-02.5
      - name: Every tag is signed by this workflow, carries an SBOM and provenance, and is under 25 MB
        env:
          MANIFEST_DIGEST: ${{ steps.sign.outputs.manifest_digest }}
        run: bash scripts/docker-published-check.sh "$GHCR_IMAGE" "$MANIFEST_DIGEST" "$IMAGE_TAGS" "$TAG_SUFFIX"
