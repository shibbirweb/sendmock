title: "[Provider] "
body:
  - type: markdown
    attributes:
      value: |
        Ask for a provider API SendMock should emulate, so your app's SDK works against SendMock unchanged.

        - Check [Providers](https://shibbirweb.github.io/sendmock/docs/providers/) first: it may already be there.
        - Search this category, and upvote a request that matches instead of opening a new one.
  - type: input
    id: provider_name
    attributes:
      label: Provider and API
      placeholder: Plivo Messages API, SparkPost Transmissions, Mollie Payments
    validations:
      required: true
  - type: dropdown
    id: provider_kind
    attributes:
      label: Kind
      options:
        - Email sending API
        - SMS, WhatsApp or verify API
        - Push notifications
        - Payment gateway
        - Webhook payload format
        - Other
    validations:
      required: true
  - type: input
    id: api_docs
    attributes:
      label: API docs
      description: The provider's official API reference.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: needed_calls
    attributes:
      label: What your app uses
      description: The endpoints, webhooks or SDK calls you need, and any test values or test numbers the provider documents.
    validations:
      required: true
  - type: input
    id: official_sdk
    attributes:
      label: Official SDK you use
      placeholder: plivo-node 4.x
