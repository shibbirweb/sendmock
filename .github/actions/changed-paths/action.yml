# Says whether a workflow's jobs should run: always on pushes, manual runs and calls from another
# workflow, and on a pull request only when it changed a file matching one of the patterns. The
# workflow's jobs then run or are skipped, and its "passed" gate reports either way, so the gate
# can be a required check even for a pull request that never touches the workflow's area.
name: Changed paths
description: Whether a pull request changed any of a workflow's paths
inputs:
  paths:
    description: Glob patterns, one per line, as a workflow's paths filter takes them
    required: true
  run-every-job:
    description: true runs every job without reading the changes
    required: true
outputs:
  is_affected:
    description: true when the workflow's jobs should run
    value: ${{ steps.match.outputs.is_affected }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      if: inputs.run-every-job != 'true'

    - id: match
      shell: bash
      env:
        RUN_EVERY_JOB: ${{ inputs.run-every-job }}
        PATH_PATTERNS: ${{ inputs.paths }}
        PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$RUN_EVERY_JOB" = "true" ]; then
          echo "is_affected=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER/files" \
          --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
        bun scripts/ci/changed-paths.ts "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"
