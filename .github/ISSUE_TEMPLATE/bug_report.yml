name: Report an issue
description: Something in SendMock does not work as it should.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go to [private vulnerability reporting](https://github.com/shibbirweb/sendmock/security/advisories/new), not here.
  - type: input
    id: version
    attributes:
      label: SendMock version
      description: Settings > About shows it; the Help menu fills it in.
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: channel
    attributes:
      label: Channel
      description: stable, beta, edge or dev.
  - type: dropdown
    id: install_method
    attributes:
      label: How you run SendMock
      options:
        - Binary
        - Docker
        - Homebrew
        - Built from source
        - Live demo (website)
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
  - type: input
    id: browser
    attributes:
      label: Browser
      description: For problems in the web UI.
      placeholder: Chrome 140
  - type: dropdown
    id: area
    attributes:
      label: Which part
      multiple: true
      options:
        - Email
        - SMS
        - Verify
        - Webhooks
        - HTTP catcher
        - Payments
        - CLI
        - MCP and AI
        - Web UI
        - Docs or website
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Send an email with ...
        2. Open ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: The server log or the CLI output with `--json`.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, tokens and real customer data from everything above.
          required: true
