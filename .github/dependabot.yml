# Keeps the GitHub Actions the workflows use up to date, in one pull request a week. Every other
# ecosystem is listed with open-pull-requests-limit 0: no version updates (each one needs the
# binary and bundle budgets checked), but its security updates take the repository's commit
# format and label from here instead of Dependabot's own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore:[#199]"
    labels:
      - dependencies

  - package-ecosystem: cargo
    directories:
      - "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore:[#199]"
    labels:
      - dependencies

  - package-ecosystem: bun
    directories:
      - "/web"
      - "/website"
      - "/video"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore:[#199]"
    labels:
      - dependencies

  - package-ecosystem: npm
    directories:
      - "/examples/**"
      - "/testcontainers/node"
      - "/packaging/**"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore:[#199]"
    labels:
      - dependencies

  - package-ecosystem: pip
    directories:
      - "/examples/**"
