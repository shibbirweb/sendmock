# Keeps the GitHub Actions the workflows use up to date, in one pull request a week. Rust and
# JavaScript dependencies get security updates from Dependabot alerts; their version updates
# stay manual, since each one needs the binary and bundle budgets checked.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore:[#199]"
    labels:
      - dependencies
