# The .deb and .rpm packages, built by Release build from the tested Linux archive
# (DS-03.3). nfpm reads the values in ${...} from the environment.
name: sendmock
arch: ${NFPM_ARCH}
platform: linux
version: ${SENDMOCK_VERSION}
version_schema: semver
section: mail
priority: optional
maintainer: MD. Shibbir Ahmed <shibbirweb@gmail.com>
description: Catch email, SMS, payments and webhooks from any app on your machine.
vendor: SendMock
homepage: https://github.com/shibbirweb/sendmock
license: MIT OR Apache-2.0
contents:
  - src: ${BINARY_PATH}
    dst: /usr/bin/sendmock
    file_info:
      mode: 0755
  - src: packaging/sendmock.service
    dst: /usr/lib/systemd/system/sendmock.service
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/sendmock/README.md
  - src: LICENSE-MIT
    dst: /usr/share/doc/sendmock/LICENSE-MIT
  - src: LICENSE-APACHE
    dst: /usr/share/doc/sendmock/LICENSE-APACHE
