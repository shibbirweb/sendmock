<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SendMock</title>
    <style>
      :root {
        --background: #ffffff;
        --foreground: #0f172a;
        --muted: #64748b;
        --accent: #0d9488;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0d1117;
          --foreground: #e6edf3;
          --muted: #8b949e;
          --accent: #2dd4bf;
          --border: #30363d;
        }
      }
      body {
        margin: 0;
        padding: 32px;
        background: var(--background);
        color: var(--foreground);
        font: 15px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 560px;
        display: grid;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        justify-self: start;
        padding: 8px 16px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #ffffff;
        font: inherit;
        cursor: pointer;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 16px;
        margin: 0;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      code {
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SendMock</h1>
      <p id="status" role="status">Checking whether SendMock is running...</p>
      <button id="open-button" type="button">Open SendMock</button>
      <dl>
        <dt>SMTP</dt>
        <dd><code>localhost:1025</code></dd>
        <dt>Web UI and API</dt>
        <dd><code>http://localhost:8025</code></dd>
        <dt>From other containers</dt>
        <dd><code>host.docker.internal:1025</code></dd>
      </dl>
    </main>
    <script>
      const sendmockUrl = "http://localhost:8025";
      const statusText = document.getElementById("status");

      // A no-cors request settles when SendMock answers and fails when nothing listens.
      async function checkSendmock() {
        try {
          await fetch(`${sendmockUrl}/api/v1/health`, { mode: "no-cors" });
          statusText.textContent = "SendMock is running at " + sendmockUrl + ".";
        } catch {
          statusText.textContent = "SendMock is starting or not running yet.";
        }
      }

      document.getElementById("open-button").addEventListener("click", () => {
        if (window.ddClient?.host?.openExternal) {
          window.ddClient.host.openExternal(sendmockUrl);
        } else {
          window.open(sendmockUrl, "_blank");
        }
      });

      checkSendmock();
      setInterval(checkSendmock, 3000);
    </script>
  </body>
</html>
