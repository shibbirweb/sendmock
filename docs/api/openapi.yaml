    RenderMode:
      type: string
      enum:
        - strict
        - lenient
    RenderProblem:
      type: object
      properties:
        message:
          type: string
        severity:
          type: string
          enum:
            - error
            - warning
        source:
          type: string
          description: '"url", "query.0", "header.0", "field.0" or "body".'
        line:
          type:
            - number
            - "null"
        column:
          type:
            - number
            - "null"
      required:
        - message
