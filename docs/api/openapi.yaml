        status_code:
          type:
            - number
            - "null"
        redirect_url:
          type:
            - string
            - "null"
        duration_ms:
          type:
            - number
            - "null"
        error_message:
          type:
            - string
            - "null"
      required:
        - url
        - kind
        - status_code
        - redirect_url
        - duration_ms
        - error_message
    LinksLookup:
      type: object
      properties:
        to:
          type: string
        email_id:
          $ref: "#/components/schemas/Ulid"
        links:
          type: array
          items:
            type: string
        received_at:
          $ref: "#/components/schemas/IsoTimestamp"
      required:
        - to
        - email_id
        - links
        - received_at
      description: "Answer of GET /api/v1/links: the links of the latest email to a recipient."
    ListUnsubscribeReport:
      type: object
      properties:
        has_header:
          type: boolean
        values:
          type: array
          items:
            type: string
        supports_one_click:
          type: boolean
        warnings:
          type: array
          items:
            type: string
      required:
        - has_header
        - values
        - supports_one_click
        - warnings
    ManualSendRequest:
      type: object
      properties:
        email_id:
          $ref: "#/components/schemas/Ulid"
          description: Send this email as the event.
          examples:
            - 01JB7T9Q2R5W8X3Y6Z1A4B7C9D
        sms_id:
          $ref: "#/components/schemas/Ulid"
          description: Send this SMS as the event.
          examples:
            - 01JB7T9Q2R5W8X3Y6Z1A4B7C9D
        http_request_id:
          $ref: "#/components/schemas/Ulid"
          description: A captured HTTP request, sent as an `http.captured` event.
          examples:
            - 01JB7T9Q2R5W8X3Y6Z1A4B7C9D
        template_id:
          type: string
          description: A template used for this send instead of the endpoint's request.
          examples:
            - slack.incoming_webhook
        request:
          $ref: "#/components/schemas/WebhookEndpointInput"
          description: A hand-written request replacing the endpoint's, from the composer.
        variables:
          type: object
          additionalProperties:
            type: string
          description: Send-time values by variable name (no `vars.`), for this send only.
          examples:
            - app_token: test-token
        body:
