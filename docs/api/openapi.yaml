    SmsOutcomeKind:
      type: string
      enum:
        - reject
        - undelivered
        - failed
        - delayed_delivery
        - read
      description: What a custom outcome number does to a matching message.
    SmsOutcomeRule:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        position:
          type: number
          description: 1-based order; lower numbers are checked first.
        match_field:
          type: string
          enum:
            - to
            - from
          description: Match the pattern against the recipient (`to`) or the sender (`from`).
          examples:
            - to
        pattern:
          type: string
          description: Exact E.164 number, or `*` for any digits, e.g. `+1555777*`.
          examples:
            - +1555777*
        outcome:
          $ref: "#/components/schemas/SmsOutcomeKind"
          description: "What happens to a matching message: `reject` (the send fails), `undelivered`, `failed`, `delayed_delivery` or `read`."
          examples:
            - undelivered
        error_code:
          type:
            - string
            - "null"
          description: Required for `reject`, `undelivered` and `failed`.
          examples:
            - "30003"
        delay_seconds:
          type:
            - number
            - "null"
          description: Required for `delayed_delivery`.
          examples:
            - 30
        note:
          type: string
          description: Why the rule exists, shown in the list.
          examples:
            - Unreachable handset for the retry test
        is_enabled:
          type: boolean
          description: Off rules are kept but skipped.
          examples:
            - true
        created_by:
          $ref: "#/components/schemas/CreatedBy"
      required:
        - id
        - position
        - match_field
        - pattern
        - outcome
        - error_code
        - delay_seconds
        - note
        - is_enabled
        - created_by
      description: "A custom outcome number: first enabled match wins."
