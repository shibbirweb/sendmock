        stack:
          type: string
        channel:
          $ref: "#/components/schemas/IntegrationChannel"
        host:
          type: string
          description: "The host the app reaches SendMock on: `127.0.0.1`, `host.docker.internal` or `sendmock`."
        language:
          type: string
        code:
          type: string
      required:
        - stack
        - channel
        - host
        - language
        - code
      description: "Answer of GET /api/v1/integrations/{stack}: copy-ready settings, as Settings > Connection shows."
    IsoTimestamp:
      type: string
      description: RFC 3339 UTC timestamp, e.g. "2026-10-24T16:00:00Z".
    LinkCheckResult:
      type: object
      properties:
        url:
          type: string
        kind:
