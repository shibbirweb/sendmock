          type: number
        unread_email_count:
          type: number
        sms_count:
          type: number
        sms_today:
          type: number
        unread_sms_count:
          type: number
        verification_count:
          type: number
        pending_verification_count:
          type: number
        http_request_count:
          type: number
        http_requests_today:
          type: number
        webhook_delivery_count:
          type: number
        webhook_success_rate:
          type:
            - number
            - "null"
        webhook_p95_latency_ms:
          type:
            - number
            - "null"
        payment_count:
          type: number
        payments_today:
          type: number
        payment_success_rate:
          type:
            - number
            - "null"
          description: Succeeded among finished payments; null before any finished.
        payment_revenue:
          type: array
          items:
            type: object
            properties:
              currency:
                type: string
              amount_minor:
                type: number
            required:
              - currency
              - amount_minor
          description: Captured minus refunded, per currency, largest first (test money).
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityBucket"
          description: 24 hourly buckets, oldest first, ending with the current hour.
        endpoint_metrics:
          type: array
          items:
            $ref: "#/components/schemas/EndpointMetrics"
        recent_failures:
          type: array
          items:
            $ref: "#/components/schemas/RecentFailedDelivery"
      required:
        - email_count
        - emails_today
        - unread_email_count
        - sms_count
        - sms_today
        - unread_sms_count
        - verification_count
        - pending_verification_count
        - http_request_count
        - http_requests_today
        - webhook_delivery_count
        - webhook_success_rate
        - webhook_p95_latency_ms
        - payment_count
        - payments_today
        - payment_success_rate
        - payment_revenue
        - activity
        - endpoint_metrics
        - recent_failures
      description: "GET /api/v1/stats: everything the Overview shows."
    AvailableRelease:
      type: object
      properties:
        version:
          type: string
          examples:
            - 0.2.0-beta.1
        published_at:
          $ref: "#/components/schemas/IsoTimestamp"
        release_notes_markdown:
          type: string
          description: The release's `CHANGELOG.md` section, in Markdown.
        release_url:
          type: string
          examples:
            - https://github.com/shibbirweb/sendmock/releases/tag/v0.2.0-beta.1
        upgrade_command:
          type:
            - string
            - "null"
          description: The command for the install method; null when the method is unknown, so follow `release_url`.
          examples:
            - brew upgrade sendmock
      required:
        - version
        - published_at
        - release_notes_markdown
        - release_url
        - upgrade_command
      description: The newer release an update check offers.
    BodyFieldType:
      type: string
      enum:
        - text
        - number
        - boolean
        - json
    CapturedHttpFile:
      type: object
      properties:
        file_index:
          type: number
        field_name:
          type: string
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: number
      required:
        - file_index
        - field_name
        - filename
        - content_type
        - size_bytes
      description: A file uploaded in a multipart request.
