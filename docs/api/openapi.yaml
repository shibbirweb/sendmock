          description: "The message field: for email `from`, `to`, `cc`, `subject`, `body`, `header:<name>`, `has_attachment`, `tag`; for SMS `from`, `to`, `body`, `status`, `api`; for opens `open_count`, `first_open`, `source`."
          examples:
            - subject
        operator:
          $ref: "#/components/schemas/RuleFilterOperator"
          description: "`equals`, `contains`, `starts_with` and `matches` (glob) ignore case; `regex` is case-sensitive; `exists` is true when the field has a value."
          examples:
            - contains
        value:
          type: string
          description: The value to compare with; ignored by `exists`.
          examples:
            - Ticket
