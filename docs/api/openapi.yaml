          type: number
        smtp_address:
          type: string
        http_address:
          type: string
        provider_address:
          type:
            - string
            - "null"
        database_path:
          type: string
        database_size_bytes:
          type: number
        is_container:
          type: boolean
      required:
        - version
        - channel
        - uptime_seconds
        - smtp_address
        - http_address
        - provider_address
        - database_path
        - database_size_bytes
        - is_container
