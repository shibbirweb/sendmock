openapi: 3.1.0
info:
  title: SendMock API
  version: 1.0.0
  description: |-
    The REST API of SendMock, the local email, SMS and webhook testing server.

    - JSON in and out; field names are snake_case.
    - Errors: `{ "error": { "code": "not_found", "message": "..." } }` with the matching HTTP status.
    - Lists that can grow are paged with an opaque `next_cursor`.
    - No auth by default; with `--ui-auth` the same basic auth or an API token protects the API.

    Generated from the endpoint registry and the TypeScript API types (`bun run openapi`); do not edit by hand.
servers:
  - url: http://127.0.0.1:8025
    description: Default local address
tags:
  - name: System
  - name: Seed
  - name: Logs
  - name: Test helpers
  - name: Automation
  - name: Email
  - name: Inbound routes
  - name: Tag rules
  - name: Forward rules
  - name: SMS
  - name: Outcome rules
  - name: Verify
  - name: Numbers
  - name: Email providers
  - name: SMS providers
  - name: HTTP Catcher
  - name: Payments
  - name: Checkout
  - name: Payment flows
  - name: Payment gateways
  - name: Payment methods
  - name: Webhook endpoints
  - name: Webhook rules
  - name: Webhook deliveries
  - name: Saved deliveries
  - name: Webhook templates
  - name: Webhook variables
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Liveness check; answers while the server runs.
      tags:
        - System
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        default:
          $ref: "#/components/responses/Error"
      x-sendmock-cli: sendmock health
      x-sendmock-mcp: sendmock_status
      x-sendmock-ui: Sidebar > live connection dot
  /api/v1/info:
