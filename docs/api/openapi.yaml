    RetryPolicy:
      type: object
      properties:
        max_attempts:
          type: number
          description: Attempts in total, the first one included.
          examples:
            - 5
        backoff_seconds:
          type: array
          items:
            type: number
          description: Seconds to wait before each retry, in order; the last value repeats.
          examples:
            - - 1
              - 5
              - 30
              - 120
              - 600
        retry_on_client_errors:
          type: boolean
          description: Also retry on 4xx answers; 5xx, timeouts and connection errors are always retried.
          examples:
            - false
      required:
        - max_attempts
        - backoff_seconds
        - retry_on_client_errors
