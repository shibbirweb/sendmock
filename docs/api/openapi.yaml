      operationId: postWebhooksVariablesByVariableIdRegenerate
      summary: Make a new fixed value for a generated-once random variable.
      tags:
        - Webhook variables
      parameters:
        - name: variableId
          in: path
          required: true
          description: The webhook variable's ID, from `GET /api/v1/webhooks/variables`.
          schema:
            type: string
          example: 01JB7T9Q2R5W8X3Y6Z1A4B7C9D
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookVariable"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
      x-sendmock-cli: sendmock webhook var regenerate <variableId>
      x-sendmock-mcp: sendmock_webhook_variable_regenerate
      x-sendmock-ui: Webhooks > Variables > Regenerate
  /api/v1/webhooks/variables/preview:
    post:
      operationId: postWebhooksVariablesPreview
      summary: What a variable definition resolves to against the sample.
      tags:
        - Webhook variables
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariablePreviewRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariablePreviewResult"
        default:
          $ref: "#/components/responses/Error"
      x-sendmock-cli: sendmock webhook var preview
      x-sendmock-mcp: sendmock_webhook_variable_preview
      x-sendmock-ui: Webhooks > Variables > variable sheet > Resolves to
components:
  schemas:
    ActivityBucket:
      type: object
      properties:
        bucket_start:
          $ref: "#/components/schemas/IsoTimestamp"
        email_count:
          type: number
        sms_count:
          type: number
        http_request_count:
          type: number
        webhook_delivery_count:
          type: number
      required:
        - bucket_start
        - email_count
        - sms_count
        - http_request_count
        - webhook_delivery_count
      description: One hour of traffic in the Overview activity chart.
    AiAgentSetup:
      type: object
      properties:
        target:
          $ref: "#/components/schemas/AiAgentTarget"
        name:
          type: string
        install_command:
          type: string
        mcp_config_path:
          type: string
          description: Where the MCP configuration goes, e.g. `.cursor/mcp.json`.
        mcp_config:
          type: string
        instructions_path:
          type: string
          description: Where the skill or instructions go, e.g. `.claude/skills/sendmock/`.
      required:
        - target
        - name
        - install_command
        - mcp_config_path
        - mcp_config
        - instructions_path
      description: "One item of GET /api/v1/ai/agents: how to connect an AI agent."
    AiAgentTarget:
      type: string
      enum:
        - claude-code
        - codex
        - cursor
        - gemini
        - vscode
    ApiErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
          required:
            - code
            - message
      required:
        - error
    ApiRequestLinkedMessage:
      type: object
      properties:
        kind:
          type: string
          enum:
            - email
            - sms
        id:
          $ref: "#/components/schemas/Ulid"
        sms_thread_id:
          type:
            - string
            - "null"
          description: Conversation of a linked SMS, for the "Open message" link.
      required:
        - kind
        - id
        - sms_thread_id
    ApiRequestLogEntry:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        api:
          type: string
        method:
          type: string
        path:
          type: string
        request_headers:
          type: object
          additionalProperties:
            type: string
        request_body:
          type: string
        response_status:
          type: number
        response_body:
          type: string
        duration_ms:
          type: number
        linked_message:
          anyOf:
            - $ref: "#/components/schemas/ApiRequestLinkedMessage"
            - type: "null"
          description: The SMS or email this request created; null for rejected requests.
        created_at:
          $ref: "#/components/schemas/IsoTimestamp"
      required:
        - id
        - api
        - method
        - path
        - request_headers
        - request_body
        - response_status
        - response_body
        - duration_ms
        - linked_message
        - created_at
    ApiStatusClass:
      type: string
      enum:
        - 2xx
        - 4xx
        - 5xx
    AppEvent:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/AppEventType"
        created_at:
          $ref: "#/components/schemas/IsoTimestamp"
        data:
          type: object
          additionalProperties: {}
          description: Trimmed to list-view fields of the subject (email, SMS, delivery, ...).
      required:
        - id
        - type
        - created_at
        - data
      description: Envelope pushed over the realtime WebSocket and sent in native webhooks.
    AppEventType:
      type: string
      enum:
        - email.received
        - email.inbound
        - email.opened
        - email.delivered
        - email.deferred
        - email.bounced
        - email.complained
        - email.unsubscribed
        - email.released
        - email.deleted
        - sms.sent
        - sms.status
        - sms.opened
        - sms.inbound
        - verify.started
        - verify.checked
        - verify.expired
        - http.captured
        - payment.created
        - payment.authorized
        - payment.succeeded
        - payment.failed
        - payment.canceled
        - payment.refunded
        - payment.partially_refunded
        - payment.dispute_opened
        - payment.dispute_closed
        - checkout.completed
        - checkout.expired
        - webhook.delivered
        - webhook.failed
        - test.ping
    AppInfo:
      type: object
      properties:
        version:
          type: string
        channel:
          $ref: "#/components/schemas/ReleaseChannel"
        uptime_seconds:
          type: number
        smtp_address:
          type: string
        http_address:
          type: string
        provider_address:
          type:
            - string
            - "null"
        database_path:
          type: string
        database_size_bytes:
          type: number
        is_container:
          type: boolean
          description: True when SendMock runs in Docker, so the UI defaults to container hostnames.
        available_operations:
          type: array
          items:
            type: string
          description: The `operationId`s this binary serves; the UI shows Not available yet for the rest.
      required:
        - version
        - channel
        - uptime_seconds
        - smtp_address
        - http_address
        - provider_address
        - database_path
        - database_size_bytes
        - is_container
        - available_operations
    AppSettings:
      type: object
      properties:
        max_emails:
          type: number
          description: The most emails kept; the oldest are deleted past it.
          examples:
            - 1000
        max_sms:
          type: number
          description: The most SMS kept; the oldest are deleted past it.
          examples:
            - 1000
        max_age_days:
          type:
            - number
            - "null"
          description: Null keeps traffic until the count limits prune it.
          examples:
            - 7
        is_plus_address_tagging_enabled:
          type: boolean
          description: Tags `user+invoice@app.test` with `invoice`.
          examples:
            - true
        email_outcome_profile:
          $ref: "#/components/schemas/EmailOutcomeProfile"
          description: "`off` sends no delivery events, `auto-delivered` marks every email delivered after a short delay, `realistic` adds bounces and complaints at the rates below."
          examples:
            - off
        email_outcome_bounce_rate_percent:
          type: number
          description: Used by the `realistic` outcome profile.
          examples:
            - 5
        email_outcome_complaint_rate_percent:
          type: number
          description: Complaints in the `realistic` outcome profile, 0 to 100.
          examples:
            - 1
        relay_smtp_url:
          type:
            - string
            - "null"
          description: Relay for release and auto-forward; the password is always masked.
          examples:
            - smtp://user:pass@smtp.yourcompany.com:587
        relay_recipient_allowlist:
          type: array
          items:
            type: string
          description: Glob patterns; release stays off while this is empty.
          examples:
            - - "*@yourcompany.com"
        spamassassin_address:
          type:
            - string
            - "null"
          description: "`host:port` of a SpamAssassin `spamd`; null turns the spam check off."
          examples:
            - 127.0.0.1:783
        sms_simulation_profile:
          $ref: "#/components/schemas/SmsSimulationProfile"
          description: "`instant` delivers at once, `realistic` goes queued, sent, then delivered over a few seconds, `manual` stays sent until you pick a status."
          examples:
            - instant
        sms_failure_rate_percent:
          type: number
          description: The share of SMS that fail at random, 0 to 100.
          examples:
            - 0
        is_strict_twilio_test_mode:
          type: boolean
          description: Rejects numbers that are not Twilio test numbers with error 21606, like real test credentials.
          examples:
            - false
        is_magic_numbers_enabled:
          type: boolean
          description: "Off: the built-in Twilio and SendMock numbers behave like any number."
          examples:
            - true
        is_magic_addresses_enabled:
          type: boolean
          description: "Off: the built-in magic addresses behave like any address."
          examples:
            - true
        fire_opened_events_on_view:
          type: boolean
          description: Fires `email.opened` and `sms.opened` when you open a message in the UI.
          examples:
            - true
        opened_event_mode:
          type: string
          enum:
            - first_open
            - every_open
          description: "`first_open` fires on the first view only, `every_open` on each view."
          examples:
            - first_open
        chaos_smtp_reject_next_count:
          type: number
          description: Rejects the next N SMTP messages, to test your app's retries.
          examples:
            - 0
        chaos_smtp_reject_code:
          $ref: "#/components/schemas/ChaosSmtpRejectCode"
          description: "The SMTP code used for rejected messages: 421, 450, 550 or 552."
          examples:
            - 450
        chaos_smtp_reject_recipient_pattern:
          type:
            - string
            - "null"
          description: Glob; matching recipients get `550 No such user`.
          examples:
            - "*@unknown.test"
        chaos_smtp_command_latency_ms:
          type: number
          description: Delay added to every SMTP command, in milliseconds.
          examples:
            - 0
        is_chaos_smtp_drop_during_data_enabled:
          type: boolean
          description: Drops the connection during `DATA`, to test half-sent messages.
          examples:
            - false
        otp_patterns:
          type: array
          items:
            type: string
          description: Ordered; the first capture group of the first match is the code.
          examples:
            - - code[:\s]+(\d{4,8})
        update_check_mode:
          $ref: "#/components/schemas/UpdateCheckMode"
          description: "When SendMock looks for a newer release: `off` never calls out, `manual` only on request, `daily` on start and once a day."
          examples:
            - off
        inbound_email_domains:
          type: array
          items:
            type: string
          description: Mail for these domains is incoming; offered as Forward suggestions.
          examples:
            - - reply.app.test
        payment_merchant_name:
          type: string
          description: Shown on checkout pages and as `{merchant}` in step labels.
          examples:
            - Demo Shop
        payment_default_currency:
          type: string
          description: For hosted checkouts created without a currency.
          examples:
            - USD
        payment_outcome_profile:
          $ref: "#/components/schemas/PaymentOutcomeProfile"
          description: "What a new hosted checkout does: `interactive` waits for the page, `auto_success` and `auto_decline` settle at once, `random` succeeds at the rate below."
          examples:
            - interactive
        payment_random_success_rate_percent:
          type: number
          description: Used by the `random` outcome profile.
          examples:
            - 80
      required:
        - max_emails
        - max_sms
        - max_age_days
        - is_plus_address_tagging_enabled
        - email_outcome_profile
        - email_outcome_bounce_rate_percent
        - email_outcome_complaint_rate_percent
        - relay_smtp_url
        - relay_recipient_allowlist
        - spamassassin_address
        - sms_simulation_profile
        - sms_failure_rate_percent
        - is_strict_twilio_test_mode
        - is_magic_numbers_enabled
        - is_magic_addresses_enabled
        - fire_opened_events_on_view
        - opened_event_mode
        - chaos_smtp_reject_next_count
        - chaos_smtp_reject_code
        - chaos_smtp_reject_recipient_pattern
        - chaos_smtp_command_latency_ms
        - is_chaos_smtp_drop_during_data_enabled
        - otp_patterns
        - update_check_mode
        - inbound_email_domains
        - payment_merchant_name
        - payment_default_currency
        - payment_outcome_profile
        - payment_random_success_rate_percent
