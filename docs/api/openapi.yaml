          required: false
          description: A recipient contains.
          schema:
            type: string
          example: user@example.test
        - name: subject
          in: query
          required: false
          description: Subject contains.
          schema:
            type: string
          example: Verify your email
        - name: since
          in: query
          required: false
          description: "Only match items newer than this time (default: 30 s ago)."
          schema:
            type: string
          example: 2026-10-26T09:30:00Z
        - name: timeout
          in: query
          required: false
          description: How long to wait, e.g. 10s (default 10s, at most 60s).
          schema:
            type: string
          example: 10s
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
