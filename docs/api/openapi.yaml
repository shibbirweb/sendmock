components:
  schemas:
    ActivityBucket:
      type: object
      properties:
        bucket_start:
          $ref: "#/components/schemas/IsoTimestamp"
        email_count:
          type: number
        sms_count:
          type: number
        http_request_count:
          type: number
        webhook_delivery_count:
          type: number
      required:
        - bucket_start
        - email_count
        - sms_count
        - http_request_count
        - webhook_delivery_count
    AiAgentSetup:
      type: object
      properties:
        target:
          $ref: "#/components/schemas/AiAgentTarget"
        name:
          type: string
        install_command:
          type: string
        mcp_config_path:
          type: string
        mcp_config:
          type: string
        instructions_path:
          type: string
      required:
        - target
        - name
        - install_command
        - mcp_config_path
        - mcp_config
        - instructions_path
    AiAgentTarget:
      type: string
      enum:
        - claude-code
        - codex
        - cursor
        - gemini
        - vscode
    ApiErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
          required:
            - code
            - message
      required:
        - error
    ApiRequestLinkedMessage:
      type: object
      properties:
        kind:
          type: string
          enum:
            - email
            - sms
        id:
          $ref: "#/components/schemas/Ulid"
        sms_thread_id:
          type:
            - string
            - "null"
      required:
        - kind
        - id
        - sms_thread_id
    ApiRequestLogEntry:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        api:
          type: string
        method:
          type: string
        path:
          type: string
        request_headers:
          type: object
          additionalProperties:
            type: string
        request_body:
          type: string
        response_status:
          type: number
        response_body:
          type: string
        duration_ms:
          type: number
        linked_message:
          anyOf:
            - $ref: "#/components/schemas/ApiRequestLinkedMessage"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/IsoTimestamp"
      required:
        - id
        - api
        - method
        - path
        - request_headers
        - request_body
        - response_status
        - response_body
        - duration_ms
        - linked_message
        - created_at
    ApiStatusClass:
      type: string
      enum:
        - 2xx
        - 4xx
        - 5xx
    AppEvent:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/AppEventType"
        created_at:
          $ref: "#/components/schemas/IsoTimestamp"
        data:
          type: object
          additionalProperties: {}
      required:
        - id
        - type
        - created_at
        - data
    AppEventType:
      type: string
      enum:
        - email.received
        - email.inbound
        - email.opened
        - email.delivered
        - email.deferred
        - email.bounced
        - email.complained
        - email.unsubscribed
        - email.released
        - email.deleted
        - sms.sent
        - sms.status
        - sms.opened
        - sms.inbound
        - verify.started
        - verify.checked
        - verify.expired
        - http.captured
        - payment.created
        - payment.authorized
        - payment.succeeded
        - payment.failed
        - payment.canceled
        - payment.refunded
        - payment.partially_refunded
        - payment.dispute_opened
        - payment.dispute_closed
        - checkout.completed
        - checkout.expired
        - webhook.delivered
        - webhook.failed
        - test.ping
    AppInfo:
      type: object
      properties:
        version:
          type: string
        channel:
          type: string
          enum:
            - stable
            - beta
            - edge
            - dev
