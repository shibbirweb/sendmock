          description: ISO 4217, e.g. USD, BDT, JPY.
        status:
          $ref: "#/components/schemas/PaymentStatus"
        customer_email:
          type:
            - string
            - "null"
        customer_name:
          type:
            - string
            - "null"
        failure_code:
          anyOf:
            - $ref: "#/components/schemas/DeclineReason"
            - type: string
              const: expired
            - type: "null"
        refunded_minor:
          type: number
        created_at:
          $ref: "#/components/schemas/IsoTimestamp"
      required:
        - id
        - provider
        - provider_name
        - provider_reference
        - amount_minor
        - currency
        - status
        - customer_email
        - customer_name
        - failure_code
        - refunded_minor
        - created_at
    PaymentTimelineEvent:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/PaymentTimelineKind"
        description:
          type: string
        created_at:
          $ref: "#/components/schemas/IsoTimestamp"
      required:
        - kind
        - description
        - created_at
    PaymentTimelineKind:
      type: string
      enum:
        - created
        - three_ds
        - authorized
        - captured
        - succeeded
        - failed
        - canceled
        - expired
        - refunded
        - dispute_opened
        - dispute_closed
        - redirected
        - delayed
        - notification_sent
    ProviderCredential:
      type: object
      properties:
        name:
          type: string
          description: The credential's name, readable in templates as `credentials.<name>`.
          examples:
            - api_key
        value:
          type: string
          description: The value; a secret comes back masked, and sending the masked value back keeps the stored one.
          examples:
            - SG.test_key_123
        is_secret:
          type: boolean
          description: Masks the value in the UI, API answers, logs and MCP output.
          examples:
            - true
      required:
        - name
        - value
        - is_secret
      description: A credential your app is configured with; a secret's value comes back masked (`••••` and the last 4).
    ProviderCredentialReveal:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required:
        - name
        - value
      description: GET .../providers/{providerKey}/credentials/{credentialName}.
    ProviderDefinitionProblem:
      type: object
      properties:
        part:
          type: string
        message:
          type: string
        severity:
          type: string
          enum:
            - error
            - warning
      required:
        - part
        - message
        - severity
      description: One template or definition problem, named by the part it is in, e.g. `Success response body`.
    ProviderErrorKind:
      type: string
      enum:
        - missing_field
        - invalid_value
        - unauthorized
        - not_found
        - rate_limited
      description: The kinds of error a provider answers with its own shape.
    ProviderErrorResponse:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/ProviderErrorKind"
          description: The kind of error this response answers.
          examples:
            - missing_field
        status:
          type: number
          description: The HTTP status code.
          examples:
            - 202
        headers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderHeaderTemplate"
          description: Headers sent with the response.
        body:
          type: string
          description: The body, a template over the message, the request and the error.
          examples:
            - '{"id": "{{ message.provider_id }}"}'
      required:
        - body
        - headers
        - kind
        - status
      description: The answer for one kind of error.
    ProviderFieldMapping:
      type: object
      properties:
        part:
          $ref: "#/components/schemas/ProviderMessagePart"
          description: The part of the message.
          examples:
            - to
        source:
          type: string
          description: "The request path it is read from: a JSON path, a form field or a query parameter."
          examples:
            - personalizations[0].to[*].email
      required:
        - part
        - source
      description: Where one part of a sent message is read from in the request.
    ProviderHeaderTemplate:
      type: object
      properties:
        name:
          type: string
          description: The header name.
          examples:
            - X-Message-Id
        template:
          type: string
          description: The value, a template over the message and the request.
          examples:
            - "{{ message.provider_id }}"
      required:
        - name
        - template
      description: A response header, from a template.
    ProviderMessagePart:
      type: string
      enum:
        - from
        - to
        - cc
        - bcc
        - reply_to
        - subject
        - text
        - html
        - attachments
        - headers
        - tags
        - template_id
        - template_data
        - body
        - media_urls
        - messaging_service
        - status_callback_url
      description: A part of a message a request can carry; email and SMS use their own parts.
    ProviderOperation:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/ProviderOperationKind"
          description: What the request does, from the kinds SendMock can run.
          examples:
            - send
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
          description: The HTTP method.
          examples:
            - POST
        path:
          type: string
          description: The path at the provider's API, with `{name}` for variable parts.
          examples:
            - /v3/{domain}/messages
        request_format:
          type: string
          enum:
            - json
            - form
            - multipart
            - query
          description: "How the request body is sent: `json`, `form`, `multipart`, or `query` for none."
          examples:
            - multipart
      required:
        - kind
        - method
        - path
        - request_format
      description: One request the provider answers.
    ProviderOperationKind:
      anyOf:
        - $ref: "#/components/schemas/EmailProviderOperationKind"
        - $ref: "#/components/schemas/SmsProviderOperationKind"
    ProviderResponseTemplate:
      type: object
      properties:
        status:
          type: number
          description: The HTTP status code.
          examples:
            - 202
        headers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderHeaderTemplate"
          description: Headers sent with the response.
        body:
          type: string
          description: The body, a template over the message, the request and the error.
          examples:
            - '{"id": "{{ message.provider_id }}"}'
      required:
        - status
        - headers
        - body
      description: "What the provider answers: a status, headers and a body template."
    ProviderSampleRequest:
      type: object
      properties:
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
          description: The HTTP method.
          examples:
            - POST
        path:
          type: string
          description: The path as your app would call it.
          examples:
            - /v3/mail/send
        headers:
          type: object
          additionalProperties:
            type: string
          description: The request headers.
          examples:
            - content-type: application/json
              authorization: Bearer SG.test_key_123
        body:
          type: string
          description: The raw request body.
          examples:
            - '{"personalizations": [{"to": [{"email": "ana@example.test"}]}], "from": {"email": "app@example.test"}, "subject": "Welcome", "content": [{"type": "text/plain", "value": "Hi"}]}'
      required:
        - method
        - path
        - headers
        - body
      description: A request to run through a provider in the preview.
    ProviderValidationRule:
