        - succeeded
        - failed
        - canceled
        - refunded
        - partially_refunded
        - disputed
    PaymentStepType:
      type: string
      enum:
        - card_form
        - account_number
        - voucher_code
        - otp
        - pin
        - signed_in_account
        - qr_code
        - reference_code
        - confirm
      description: The step types SendMock can show on a checkout page and check.
    PaymentStepTypeInfo:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/PaymentStepType"
        name:
          type: string
        description:
          type: string
        is_deciding:
          type: boolean
          description: Decides the outcome from the method's test values; a flow has at most one.
        has_field:
          type: boolean
          description: Shows an input, so it needs a field label.
        method_values:
          type: array
          items:
            $ref: "#/components/schemas/PaymentMethodValueKind"
        default_labels:
          type: object
          properties:
            title:
              type: string
              description: Shown above the step; may be empty.
              examples:
                - Enter the code sent to your phone
            field_label:
              type: string
              description: The input's label; empty for steps without a field.
              examples:
                - Verification code
            hint:
              type: string
              description: Small text under the input; `{method}` and `{amount}` are replaced.
              examples:
                - We sent a 6 digit code to your {method} number.
            button_label:
              type: string
              description: The button's text.
              examples:
                - Verify
          required:
            - title
            - field_label
            - hint
            - button_label
      required:
        - type
        - name
        - description
        - is_deciding
        - has_field
        - method_values
        - default_labels
      description: "GET /api/v1/payments/step-types: one entry of the step catalogue."
    PaymentSummary:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        provider:
          $ref: "#/components/schemas/PaymentProvider"
        provider_name:
          type: string
          description: The gateway's name, e.g. "SSLCommerz".
        provider_reference:
          type: string
          description: "The provider's main id: session, intent, order or transaction."
        amount_minor:
          type: number
        currency:
