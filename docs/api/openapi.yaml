        - id
        - bin_id
        - bin_name
        - method
        - url
        - path
        - query
        - headers
        - body
        - content_type
        - files
        - client_ip
        - response_status
        - response_headers
        - response_body
        - matched_rule_id
        - matched_rule_name
        - is_simulated_failure
        - duration_ms
        - created_at
    CardTestOutcome:
      type: string
      enum:
        - succeed
        - decline
        - three_ds
        - succeed_then_dispute
    ChaosSmtpRejectCode:
      type: number
      enum:
        - 421
        - 450
        - 550
        - 552
      description: SMTP reply codes the chaos options can answer with.
    CheckoutAction:
      type: string
      enum:
        - pay
        - decline
        - cancel
        - delay
        - require_three_ds
        - three_ds_approve
        - three_ds_fail
    CheckoutCard:
      type: object
      properties:
        number:
          type: string
          description: A test card number of the method.
          examples:
            - "4242424242424242"
        exp_month:
          type: number
          description: Expiry month, 1 to 12.
          examples:
            - 12
        exp_year:
          type: number
          description: Expiry year, four digits.
          examples:
            - 2030
        cvc:
          type: string
          description: Any three or four digits.
