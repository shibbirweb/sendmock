          required:
            - all
        - type: object
          properties:
            any:
              type: array
              items:
                $ref: "#/components/schemas/RuleFilter"
              description: Matches when at least one filter in the list matches.
          required:
            - any
        - type: object
          properties:
            not:
              $ref: "#/components/schemas/RuleFilter"
              description: Matches when the filter inside does not.
          required:
            - not
        - $ref: "#/components/schemas/RuleCondition"
    RuleFilterOperator:
      type: string
