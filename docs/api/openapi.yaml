          description: "For `refund`: the amount in minor units; the full amount when left out."
          examples:
            - 500
        dispute_outcome:
          type: string
          enum:
            - won
            - lost
          description: "For `resolve_dispute`: `won` or `lost`."
          examples:
            - won
