        url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
        problems:
          type: array
          items:
            $ref: "#/components/schemas/RenderProblem"
      required:
        - rendered_against
        - event_type
        - method
        - url
        - headers
        - body
        - problems
    ExtractedData:
