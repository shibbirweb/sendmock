        endpoint_id:
          $ref: "#/components/schemas/Ulid"
          description: A saved endpoint's own variables are used too; alone, its stored settings are rendered.
          examples:
            - 01JB7T9Q2R5W8X3Y6Z1A4B7C9D
        email_id:
          $ref: "#/components/schemas/Ulid"
          description: Render against this email; without an email, SMS or request ID the sample event is used.
          examples:
            - 01JB7T9Q2R5W8X3Y6Z1A4B7C9D
        sms_id:
          $ref: "#/components/schemas/Ulid"
          description: Render against this SMS.
          examples:
            - 01JB7T9Q2R5W8X3Y6Z1A4B7C9D
        http_request_id:
          $ref: "#/components/schemas/Ulid"
          description: Render against this captured HTTP request.
          examples:
            - 01JB7T9Q2R5W8X3Y6Z1A4B7C9D
        variables:
          type: object
          additionalProperties:
            type: string
          description: Send-time values by variable name (no `vars.`); they win for this render.
          examples:
            - app_token: test-token
      description: Body of POST /api/v1/webhooks/endpoints/preview.
    EndpointPreviewResult:
      type: object
      properties:
        rendered_against:
          type: string
        event_type:
