        - approved
        - canceled
        - expired
        - max_attempts
    ForwardRule:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          description: A name for the rule, shown in the list.
          examples:
            - Invoices to finance QA
        filter:
          anyOf:
            - $ref: "#/components/schemas/RuleFilter"
            - type: "null"
          description: The webhook rule filter, over email fields; null matches every email.
        to:
          type: array
          items:
            type: string
          description: Real addresses; each must be on the relay allowlist.
          examples:
            - - finance-qa@yourcompany.com
        is_enabled:
          type: boolean
          description: Off rules are kept but skipped.
          examples:
            - true
        position:
          type: number
      required:
        - id
        - name
        - filter
        - to
        - is_enabled
        - position
      description: Releases arriving emails that match its filter to real addresses.
    ForwardRuleInput:
      type: object
      properties:
        name:
          type: string
          description: A name for the rule, shown in the list.
          examples:
            - Invoices to finance QA
        filter:
          anyOf:
            - $ref: "#/components/schemas/RuleFilter"
            - type: "null"
          description: The webhook rule filter, over email fields; null matches every email.
        to:
          type: array
          items:
            type: string
          description: Real addresses; each must be on the relay allowlist.
          examples:
            - - finance-qa@yourcompany.com
        is_enabled:
          type: boolean
          description: Off rules are kept but skipped.
          examples:
            - true
      required:
        - name
        - filter
        - to
        - is_enabled
      description: Body of POST and PATCH /api/v1/forward-rules.
    ForwardRuleInputPatch:
      type: object
      properties:
        name:
          type: string
          description: A name for the rule, shown in the list.
          examples:
            - Invoices to finance QA
        filter:
          anyOf:
            - $ref: "#/components/schemas/RuleFilter"
            - type: "null"
          description: The webhook rule filter, over email fields; null matches every email.
        to:
          type: array
          items:
            type: string
          description: Real addresses; each must be on the relay allowlist.
          examples:
            - - finance-qa@yourcompany.com
        is_enabled:
          type: boolean
          description: Off rules are kept but skipped.
          examples:
            - true
    GatewayCredential:
      type: object
      properties:
        name:
          type: string
          description: The credential's name, readable in templates as `merchant.<name>`.
          examples:
            - webhook_secret
        value:
          type: string
          description: The value; a secret comes back masked.
          examples:
            - whsec_test_123
        is_secret:
          type: boolean
          description: Masks the value in the UI, API answers and logs.
          examples:
            - true
      required:
        - name
        - value
        - is_secret
      description: A merchant credential; a secret's value comes back masked (`••••` and the last 4).
    GatewayCredentialReveal:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required:
        - name
        - value
      description: GET /api/v1/payments/gateways/{gatewayKey}/credentials/{credentialName}.
    GatewayHeaderTemplate:
      type: object
      properties:
        name:
          type: string
          description: The header name.
          examples:
            - stripe-signature
        template:
          type: string
          description: The value, a template; signature helpers sign the body.
          examples:
            - "{{ stripe_signature(merchant.webhook_secret) }}"
      required:
        - name
        - template
    GatewayRedirectField:
      type: object
      properties:
        name:
          type: string
          description: The parameter name sent to your app.
          examples:
            - session_id
        template:
          type: string
          description: The value, a template over the payment.
          examples:
            - "{{ payment.reference }}"
        send_on:
          type: string
          enum:
            - always
            - success
          description: PayPal sends `PayerID` only after a successful approval.
          examples:
            - always
      required:
        - name
        - template
        - send_on
      description: A field sent back to the app on redirect, from a template.
    GatewayTemplateProblem:
      type: object
      properties:
        part:
          type: string
        message:
          type: string
        severity:
          type: string
          enum:
            - error
            - warning
      required:
        - part
        - message
        - severity
      description: One template problem, named by the part it is in, e.g. `Redirect field status`.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status
      description: Answer of `GET /health`.
    HtmlCheckReport:
      type: object
      properties:
        overall_support_percent:
          type: number
        clients:
          type: array
          items:
            $ref: "#/components/schemas/HtmlClientSupport"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/HtmlCheckWarning"
      required:
        - overall_support_percent
        - clients
        - warnings
    HtmlCheckWarning:
      type: object
      properties:
        feature:
          type: string
        support_percent:
          type: number
        line:
          type:
            - number
            - "null"
        note:
          type: string
      required:
        - feature
        - support_percent
        - line
        - note
    HtmlClientSupport:
      type: object
      properties:
        client:
          type: string
        support_percent:
          type: number
      required:
        - client
        - support_percent
      description: Results of the email quality checks (docs/plan/03-email.md#quality-checks).
    HttpBin:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
        preset:
          anyOf:
            - $ref: "#/components/schemas/HttpBinPreset"
            - type: "null"
        request_count:
          type: number
        last_request_at:
          anyOf:
            - $ref: "#/components/schemas/IsoTimestamp"
            - type: "null"
        default_response:
          $ref: "#/components/schemas/HttpMockResponse"
          description: Sent when no rule matches; `200 {"ok":true}` unless a preset sets another.
      required:
        - id
        - name
        - preset
        - request_count
        - last_request_at
        - default_response
    HttpBinInput:
      type: object
      properties:
        name:
          type: string
          description: The bin's name; your app calls `/catch/<name>/...`.
          examples:
            - slack
        preset:
          anyOf:
            - $ref: "#/components/schemas/HttpBinPreset"
            - type: "null"
          description: A ready-made bin that answers like the real service (`slack`, `discord`, `teams`, `google_chat`, `telegram`, `fcm`, `expo`, `onesignal`, `generic`); null for a plain bin.
          examples:
            - slack
      required:
        - name
        - preset
      description: Body of POST /api/v1/http/bins.
    HttpBinPreset:
      type: string
      enum:
        - slack
        - discord
        - teams
        - google_chat
        - telegram
        - fcm
        - expo
        - onesignal
        - generic
      description: Ready-made bins whose replies mimic the real service.
    HttpBinUpdate:
      type: object
      properties:
        default_response:
          $ref: "#/components/schemas/HttpMockResponse"
          description: The reply sent when no rule matches.
      required:
        - default_response
      description: Body of `PATCH /http/bins/{binId}`.
    HttpForwardRequest:
      type: object
      properties:
        url:
          type: string
          description: Where the captured request is sent again, e.g. your local handler.
          examples:
            - http://localhost:3000/webhooks/slack
      required:
        - url
      description: Body of POST /api/v1/http/requests/{requestId}/forward.
    HttpForwardResult:
      type: object
      properties:
        status_code:
          type: number
        duration_ms:
          type: number
        body:
          type: string
      required:
        - status_code
        - duration_ms
        - body
    HttpMethod:
      type: string
      enum:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
    HttpMockResponse:
      type: object
      properties:
        status_code:
          type: number
          description: The HTTP status of the reply.
          examples:
            - 200
        headers:
          type: object
          additionalProperties:
            type: string
          description: Reply headers, by name; values are templates.
          examples:
            - Content-Type: application/json
        body:
          type: string
          description: The reply body, a template over the captured request.
          examples:
            - '{"ok": true}'
      required:
        - status_code
        - headers
        - body
      description: A reply SendMock sends; headers and body are templates.
    HttpResponseRule:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
          description: Empty for a new rule in a PUT; the API assigns it.
          examples:
            - 01JB7T9Q2R5W8X3Y6Z1A4B7C9D
        name:
          type: string
          description: A name for the rule, shown in the list.
          examples:
            - Rate limit the push API
        is_enabled:
          type: boolean
          description: Off rules are kept but skipped.
          examples:
            - true
        method:
          anyOf:
            - $ref: "#/components/schemas/HttpMethod"
            - type: "null"
          description: Null matches any method.
          examples:
            - POST
        path_glob:
          type: string
          description: Relative to the bin, e.g. `/v1/*`; empty matches any path.
          examples:
            - /v1/*
        filter:
          anyOf:
            - $ref: "#/components/schemas/RuleFilter"
            - type: "null"
          description: Header and body conditions, as in webhook rules.
        response:
          $ref: "#/components/schemas/HttpMockResponse"
          description: The reply sent when the rule matches.
        delay_min_ms:
          type: number
          description: A fixed delay when both are equal, else a random one in the range.
          examples:
            - 0
        delay_max_ms:
          type: number
          description: The longest delay before replying, in milliseconds; equal to `delay_min_ms` for a fixed delay.
          examples:
            - 500
        failure_rate_percent:
          type: number
          description: The share of matching requests answered with `failure_status_code` instead, 0 to 100.
          examples:
            - 10
        failure_status_code:
          type: number
          description: The status sent for a simulated failure.
          examples:
            - 503
      required:
        - id
        - name
        - is_enabled
        - method
        - path_glob
        - filter
        - response
        - delay_min_ms
        - delay_max_ms
        - failure_rate_percent
        - failure_status_code
      description: One mock response rule; rules are checked in order and the first match answers.
    HttpRulePreviewRequest:
      type: object
      properties:
        rule:
          $ref: "#/components/schemas/HttpResponseRule"
          description: The rule to try, saved or not.
        request_id:
          $ref: "#/components/schemas/Ulid"
          description: The captured request to try it on.
          examples:
            - 01JB7T9Q2R5W8X3Y6Z1A4B7C9D
      required:
        - rule
        - request_id
      description: Body of POST /api/v1/http/bins/{binId}/responses/preview.
    HttpRulePreviewResult:
      type: object
      properties:
        is_match:
          type: boolean
        mismatch_reason:
          type:
            - string
            - "null"
          description: Why the rule does not match, e.g. "Method is GET, not POST".
        response:
          $ref: "#/components/schemas/HttpMockResponse"
        problems:
          type: array
          items:
            type: string
      required:
        - is_match
        - mismatch_reason
        - response
        - problems
    InboundRoute:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        priority:
          type: number
          description: Lower runs first.
          examples:
            - 10
        description:
          type: string
          description: A name for the route, shown in the list.
          examples:
            - Ticket replies to the helpdesk
        filter:
          $ref: "#/components/schemas/InboundRouteFilter"
          description: Which incoming emails the route takes.
        expression:
          type: string
          description: The filter in Mailgun syntax, e.g. `match_recipient("support@.*")`.
        actions:
          type: array
          items:
            $ref: "#/components/schemas/InboundRouteAction"
          description: What the route does with a matching email, in order.
        action_expressions:
          type: array
          items:
            type: string
          description: Each action in Mailgun syntax, e.g. `forward("http://...")`.
        created_at:
          $ref: "#/components/schemas/IsoTimestamp"
      required:
        - id
        - priority
        - description
        - filter
        - expression
        - actions
        - action_expressions
        - created_at
      description: A Mailgun-style inbound route.
    InboundRouteAction:
      anyOf:
        - type: object
          properties:
            kind:
              type: string
              const: forward_url
              description: POSTs the parsed email to a URL in Mailgun's format.
            url:
              type: string
              description: Your app's inbound mail webhook.
              examples:
                - http://localhost:8000/webhooks/mail
          required:
            - kind
            - url
        - type: object
          properties:
            kind:
              type: string
              const: forward_email
              description: Forwards to a real address, only through the release allowlist.
            address:
              type: string
              description: The real address.
              examples:
                - dev@yourcompany.com
          required:
            - kind
            - address
        - type: object
          properties:
            kind:
              type: string
              const: store
              description: Keeps the message and can POST a notification with its `message-url`.
            notify_url:
              type:
                - string
                - "null"
              description: Where the notification goes; null stores without notifying.
              examples:
                - http://localhost:8000/webhooks/stored
          required:
            - kind
            - notify_url
        - type: object
          properties:
            kind:
              type: string
              const: stop
              description: Skips the routes with a higher priority number.
          required:
            - kind
      description: What a route does with a matching email, in order.
    InboundRouteFilter:
      anyOf:
        - type: object
          properties:
            kind:
              type: string
              const: match_recipient
              description: A regular expression on each recipient.
            pattern:
              type: string
              description: The regular expression; named groups can be used in actions as `\g<name>`.
              examples:
                - reply\+(?P<token>.+)@reply.app.test
          required:
            - kind
            - pattern
        - type: object
          properties:
            kind:
              type: string
              const: match_header
              description: A regular expression on a header.
            header_name:
              type: string
              description: The header to match, e.g. `subject`.
              examples:
                - subject
            pattern:
              type: string
              description: The regular expression for the header's value.
              examples:
                - .*support
          required:
            - kind
            - header_name
            - pattern
        - type: object
          properties:
            kind:
              type: string
              const: catch_all
              description: Every incoming email.
          required:
            - kind
      description: Which incoming emails a route takes (Mailgun's filters).
    InboundRouteInput:
      type: object
      properties:
        priority:
          type: number
          description: Lower runs first.
          examples:
            - 10
        description:
          type: string
          description: A name for the route, shown in the list.
          examples:
            - Ticket replies to the helpdesk
        filter:
          $ref: "#/components/schemas/InboundRouteFilter"
          description: Which incoming emails the route takes.
        actions:
          type: array
          items:
            $ref: "#/components/schemas/InboundRouteAction"
          description: What the route does with a matching email, in order.
      required:
        - priority
        - description
        - filter
        - actions
      description: Body of POST /api/v1/inbound-routes and PATCH /api/v1/inbound-routes/{routeId}.
    InboundRouteMatch:
      type: object
      properties:
        email_id:
          $ref: "#/components/schemas/Ulid"
        from:
          type: string
        matched_value:
          type: string
          description: The recipient or header value that matched.
        subject:
          type: string
        captured_groups:
          type: object
          additionalProperties:
            type: string
          description: Named groups, usable in actions as `\g<name>`.
      required:
        - email_id
        - from
        - matched_value
        - subject
        - captured_groups
    InboundRouteTestRequest:
      type: object
      properties:
        filter:
          $ref: "#/components/schemas/InboundRouteFilter"
          description: The filter to try on the 50 most recent incoming emails.
      required:
        - filter
      description: "Body of POST /api/v1/inbound-routes/test: a filter to try on recent incoming emails."
    InboundRouteTestResult:
      type: object
      properties:
        checked_count:
          type: number
          description: How many recent incoming emails were checked (at most 50).
        matches:
          type: array
          items:
            $ref: "#/components/schemas/InboundRouteMatch"
      required:
        - checked_count
        - matches
    InboundSmsRequest:
      type: object
      properties:
        from:
          type: string
          description: "Who texts your app: the user's number."
          examples:
            - "+8801700000000"
        to:
          type: string
          description: Your app's number that receives it, usually a virtual number.
          examples:
            - "+15550001111"
        body:
          type: string
          description: The message text.
          examples:
            - STOP
        channel:
          $ref: "#/components/schemas/SmsChannel"
          description: "`sms` (default) or `whatsapp`."
          examples:
            - sms
        template_id:
          type: string
          description: The payload template for the inbound webhook, instead of the number's (e.g. `twilio.inbound_sms`).
          examples:
            - twilio.inbound_sms
        media:
          type: array
          items:
            $ref: "#/components/schemas/InlineSmsMedia"
          description: Files sent with the message, as MMS or WhatsApp media.
      required:
        - from
        - to
        - body
      description: Body of POST /api/v1/sms/inbound (simulate an incoming message).
    InboundWebhookMethod:
      type: string
      enum:
        - POST
        - GET
    InlineSmsMedia:
      type: object
      properties:
        filename:
          type: string
          description: The file name, e.g. `photo.jpg`.
          examples:
            - photo.jpg
        content:
          type: string
          description: The file bytes, base64 encoded.
          examples:
            - /9j/4AAQSkZJRgABAQ
        content_type:
          type: string
          description: Guessed from the file extension when missing.
          examples:
            - image/jpeg
      required:
        - filename
        - content
      description: An inline file in `media` of a native or simulated inbound send.
    InstallMethod:
      type: string
      enum:
        - homebrew
        - scoop
        - docker
        - install_script
        - npm
        - unknown
      description: How SendMock was installed, baked in by each package; it picks the upgrade command.
    IntegrationChannel:
      type: string
      enum:
        - email
        - sms
        - http
    IntegrationSnippet:
      type: object
