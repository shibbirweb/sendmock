          $ref: "#/components/schemas/ProviderMessagePart"
          description: The part of the message checked.
          examples:
            - to
        check:
          type: string
          enum:
            - required
            - email_address
            - e164_number
            - max_length
          description: "The check: present, an email address, an E.164 number, or at most `max_length` characters."
          examples:
            - required
        max_length:
          type:
            - number
            - "null"
          description: The longest value allowed, for `max_length`; null otherwise.
          examples:
            - null
        error_kind:
          $ref: "#/components/schemas/ProviderErrorKind"
          description: The error answered when the check fails.
          examples:
            - missing_field
      required:
        - part
        - check
        - max_length
        - error_kind
      description: A check on a request, and the error it answers when the check fails.
    RecentFailedDelivery:
