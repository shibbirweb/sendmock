name = "otp-from-sms"

# Your app would send this; here a sample stands in for it.
[[steps]]
run = "sample.send"
with = { kind = "sms" }
save = "sample"

[[steps]]
run = "sms.get"
with = { smsId = "{{ sample.id }}" }
save = "sms"

[[steps]]
run = "otp.get"
with = { to = "{{ sms.to_number }}", channel = "sms" }
save = "otp"

[[steps]]
run = "assert"
with = { that = "{{ otp.code | length }} == 6" }
