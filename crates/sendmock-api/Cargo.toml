[package]
name = "sendmock-api"
description = "The SendMock HTTP server: REST routes, realtime, OpenAPI and the embedded UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# web-dist is the UI build copied in before packaging (scripts/release/stage-crate-files.sh).
include = [
    "build.rs",
    "src/**/*",
    "web-dist/**/*",
]

[dependencies]
sendmock-core.workspace = true
sendmock-ops.workspace = true

axum = { workspace = true, features = [
    "ws",
] }
base64.workspace = true
flate2.workspace = true
futures-util.workspace = true
rust-embed.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
chrono.workspace = true
jsonschema.workspace = true
serde_yaml_ng.workspace = true
sendmock-payments.workspace = true
ring.workspace = true
tempfile.workspace = true
sendmock-store.workspace = true
sendmock-webhooks.workspace = true
tokio = { workspace = true, features = [
    "io-util",
] }
tokio-tungstenite.workspace = true
tower.workspace = true

[lints]
workspace = true
