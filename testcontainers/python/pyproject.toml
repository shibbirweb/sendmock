[project]
name = "sendmock-testcontainers"
version = "0.1.0"
description = "Starts SendMock in Docker from a test and gives its SMTP, HTTP and provider addresses."
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "testcontainers==4.15.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sendmock_testcontainers"]
