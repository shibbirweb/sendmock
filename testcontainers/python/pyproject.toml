[project]
name = "sendmock-testcontainers"
version = "1.3.1-beta.2"
description = "Starts SendMock in Docker from a test and gives its SMTP, HTTP and provider addresses."
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "testcontainers==4.15.0",
]

[project.urls]
Homepage = "https://shibbirweb.github.io/sendmock/"
Source = "https://github.com/shibbirweb/sendmock/tree/develop/testcontainers/python"

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sendmock_testcontainers"]
