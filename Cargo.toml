# Each crate belongs to one layer (AGENTS.md); scripts/rust-crate-layers.ts fails when a
# crate depends on its own or a higher layer.
[workspace]
resolver = "3"
members = [
    "crates/*",
]

[workspace.package]
# The version is the source of truth that scripts/version.ts syncs into every other file.
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shibbirweb/sendmock"
homepage = "https://shibbirweb.github.io/sendmock/"

[workspace.dependencies]
sendmock-api = { path = "crates/sendmock-api" }
sendmock-cli = { path = "crates/sendmock-cli" }
sendmock-core = { path = "crates/sendmock-core" }
sendmock-mcp = { path = "crates/sendmock-mcp" }
sendmock-ops = { path = "crates/sendmock-ops" }
sendmock-smtp = { path = "crates/sendmock-smtp" }
sendmock-sms = { path = "crates/sendmock-sms" }
sendmock-store = { path = "crates/sendmock-store" }
sendmock-webhooks = { path = "crates/sendmock-webhooks" }

rand = "0.10"
ulid = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# External input must never panic; clippy.toml still allows both in tests.
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
